name: 每日历史赛果抓取与解析

on:
  workflow_dispatch:           # 手动触发

jobs:
  fetch-and-parse:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖（Playwright + pandas）
        run: |
          pip install playwright pandas
          playwright install chromium
          playwright install-deps

      - name: 抓取 results 数据
        run: python fetch_results.py

      - name: 解析 results.json 生成 history.csv
        run: python results_parser.py --input results.json --history history.csv --output history.csv

      - name: 提交 results.json 和 history.csv 到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json history.csv
          git diff --staged --quiet || git commit -m "每日更新历史赛果和比分汇总 $(date '+%Y-%m-%d')"
          git push
