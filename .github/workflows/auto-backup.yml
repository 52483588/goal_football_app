name: 定时下载、处理并上传UC网盘

on:
  schedule:
    - cron: '0 0,12 * * *'      # 每天北京时间 08:00 和 20:00
  workflow_dispatch:              # 允许手动触发

jobs:
  # ==================== 任务1: 下载和处理文件 ====================
  process-files:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    
    outputs:
      timestamp: ${{ steps.set-time.outputs.timestamp }}
      date: ${{ steps.set-time.outputs.date }}

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      # 设置北京时间并生成时间戳
      - name: 设置北京时间
        id: set-time
        run: |
          sudo timedatectl set-timezone Asia/Shanghai
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          DATE=$(date +%Y%m%d)
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          echo "DATE=$DATE" >> $GITHUB_ENV

      # 确保三个目标文件夹存在
      - name: 创建文件夹结构
        run: |
          mkdir -p HisData
          mkdir -p docs
          mkdir -p data

      # 清理 HisData 中前两天的文件夹
      - name: 删除前两天的HisData文件夹
        run: |
          cd HisData
          two_days_ago=$(date -d "2 days ago" +%Y%m%d)
          for dir in */; do
            dirname=${dir%/}
            dir_date=${dirname:0:8}
            if [[ "$dir_date" == "$two_days_ago" ]]; then
              echo "删除文件夹: $dirname"
              rm -rf "$dirname"
            fi
          done
      
      # 删除根目录下所有现有的 XML 文件
      - name: 删除根目录旧XML文件
        run: find . -maxdepth 1 -name "*.xml" -type f -delete

      # 下载最新8个XML到根目录
      - name: 下载最新XML
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (Chrome/130.0.0.0)"
          curl -L -A "$UA" -o windrawwinfirsthalf.xml "https://www.macauslot.com/content/data/soccer/xml/odds/windrawwinfirsthalf.xml"
          curl -L -A "$UA" -o odds_config.xml "https://www.macauslot.com/content/data/soccer/xml/odds/odds_config.xml"
          curl -L -A "$UA" -o windrawwin.xml "https://www.macauslot.com/content/data/soccer/xml/odds/windrawwin.xml"
          curl -L -A "$UA" -o halffull.xml "https://www.macauslot.com/content/data/soccer/xml/odds/halffull.xml"
          curl -L -A "$UA" -o winodds.xml "https://www.macauslot.com/content/data/soccer/xml/odds/winodds.xml"
          curl -L -A "$UA" -o overunder.xml "https://www.macauslot.com/content/data/soccer/xml/odds/overunder.xml"
          curl -L -A "$UA" -o numberofgoals.xml "https://www.macauslot.com/content/data/soccer/xml/odds/numberofgoals.xml"
          curl -L -A "$UA" -o correctscore.xml "https://www.macauslot.com/content/data/soccer/xml/odds/correctscore.xml"

      # 验证下载完整性
      - name: 验证下载完整性
        run: |
          ALL_FILES=("windrawwinfirsthalf.xml" "odds_config.xml" "windrawwin.xml" "halffull.xml" "winodds.xml" "overunder.xml" "numberofgoals.xml" "correctscore.xml")
          for f in "${ALL_FILES[@]}"; do
            if [ ! -s "$f" ]; then
              echo "❌ 文件 $f 不存在或为空，下载失败"
              exit 1
            fi
          done
          echo "✅ 所有8个XML文件下载成功"

      # 复制XML到HisData/时间戳/ 目录
      - name: 复制XML到HisData时间戳文件夹
        run: |
          ARCHIVE_DIR="HisData/${{ env.TIMESTAMP }}"
          mkdir -p "$ARCHIVE_DIR"
          cp *.xml "$ARCHIVE_DIR/"
          echo "✅ 已复制到 $ARCHIVE_DIR"

      # 提交下载更新
      - name: 提交下载更新
        run: |
          git config user.name "Auto Bot"
          git config user.email "bot@example.com"
          git add HisData/ *.xml
          git pull --rebase --autostash origin main || true
          git commit -m "归档 ${{ env.TIMESTAMP }} 并更新最新XML" || echo "No changes"
          git push

      # ========== 生成静态文件 ==========
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests numpy pandas

      - name: Generate his_data.js
        run: python parse_xml.py

      - name: 提交静态文件到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/his_data.js docs/index.html
          git diff --staged --quiet || git commit -m "Update static files [skip ci]"
          git push

      # ========== 运行分析脚本 ==========
      - name: List files (debug)
        run: ls -la

      - name: Run analysis script
        run: python bb.py

      - name: Commit and push generated files
        uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions[bot]
          author_email: github-actions[bot]@users.noreply.github.com
          message: "Auto update analysis result [skip ci]"
          add: "data/"
          github_token: ${{ secrets.PAT_TOKEN }}

      # 打包需要上传到UC网盘的三个文件夹
      - name: 打包HisData、docs、data文件夹
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          zip -r "uc_upload_${TIMESTAMP}.zip" HisData docs data
          echo "UPLOAD_FILE=uc_upload_${TIMESTAMP}.zip" >> $GITHUB_ENV
          echo "✅ 已打包为 uc_upload_${TIMESTAMP}.zip"

      # 上传打包文件作为Artifact供下一步使用
      - name: 上传打包文件
        uses: actions/upload-artifact@v4
        with:
          name: uc-backup-${{ steps.set-time.outputs.date }}
          path: ${{ env.UPLOAD_FILE }}
          retention-days: 1

  # ==================== 任务2: 上传到UC网盘并发送通知 ====================
  upload-to-uc:
    runs-on: ubuntu-latest
    needs: process-files
    timeout-minutes: 10
    
    steps:
      - name: 检出仓库（获取上传脚本）
        uses: actions/checkout@v4
      
      - name: 下载打包文件
        uses: actions/download-artifact@v4
        with:
          name: uc-backup-${{ needs.process-files.outputs.date }}
          path: ./to_upload

      - name: 安装Python依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip install requests

      - name: 测试 UC Cookie 是否有效
        env:
          UC_COOKIE: ${{ secrets.UC_COOKIE }}
        run: |
          cat > test_cookie.py << 'EOF'
          import os
          import requests
          import sys
          
          UC_COOKIE = os.environ.get('UC_COOKIE', '')
          
          if not UC_COOKIE:
              print("❌ 未设置 UC_COOKIE")
              sys.exit(1)
          
          print("🔐 测试 UC Cookie...")
          
          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
              'Cookie': UC_COOKIE
          })
          
          # 测试获取用户信息
          test_url = "https://pc-api.uc.cn/1/clouddrive/user/info?pr=UCBrowser&fr=pc"
          resp = session.get(test_url)
          
          print(f"📡 请求: {test_url}")
          print(f"📊 HTTP 状态码: {resp.status_code}")
          print(f"📝 响应内容: {resp.text[:300] if resp.text else '空'}")
          
          if resp.status_code == 200:
              print("✅ Cookie 有效")
              sys.exit(0)
          else:
              print("❌ Cookie 可能已过期或无效")
              sys.exit(1)
          EOF
          
          python3 test_cookie.py

      - name: 发送微信通知
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          if [ -z "$PUSHPLUS_TOKEN" ]; then
            echo "未配置 PUSHPLUS_TOKEN，跳过微信通知"
            exit 0
          fi
          
          CURRENT_TIME=$(date '+%Y-%m-%d %H:%M:%S')
          
          UPLOAD_FILE=$(ls -t ./to_upload/*.zip 2>/dev/null | head -1)
          if [ -n "$UPLOAD_FILE" ]; then
            FILE_SIZE=$(ls -lh "$UPLOAD_FILE" | awk '{print $5}')
          else
            FILE_SIZE="未知"
          fi
          
          MESSAGE="【定时备份通知】

          ✅ 备份任务执行成功
          📅 备份时间: ${CURRENT_TIME}
          📦 备份内容: HisData / docs / data
          💾 文件大小: ${FILE_SIZE}
          ☁️ 存储位置: UC网盘
          🔗 分享链接: 请登录UC网盘查看"
          
          curl -s -X POST "http://www.pushplus.plus/send" -H "Content-Type: application/json" -d "{\"token\":\"${PUSHPLUS_TOKEN}\",\"title\":\"定时备份通知\",\"content\":\"${MESSAGE}\"}"
          
          echo "已通过 PushPlus 发送微信通知"
