name: 综合备份 & 实时比分抓取

on:
  workflow_dispatch:           # 保留手动触发

jobs:
  process-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置北京时间
        id: set-time
        run: |
          sudo timedatectl set-timezone Asia/Shanghai
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          DATE=$(date +%Y%m%d)
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          echo "DATE=$DATE" >> $GITHUB_ENV

      - name: 创建文件夹结构
        run: |
          mkdir -p HisData docs data

      - name: 删除72小时前的HisData文件夹
        run: |
          cd HisData
          # 子文件夹按时间戳命名，排序后保留最新 72 个（=72小时），删除其余
          mapfile -t dirs < <(ls -d */ 2>/dev/null | sed 's#/$##' | sort)
          total=${#dirs[@]}
          keep=72
          if [ "$total" -gt "$keep" ]; then
            delete_count=$((total - keep))
            for ((i=0; i<delete_count; i++)); do
              echo "删除文件夹: ${dirs[i]}"
              rm -rf "${dirs[i]}"
            done
            echo "已删除 $delete_count 个旧文件夹，保留最新 $keep 个"
          else
            echo "当前共 $total 个文件夹，未超过 $keep 个，无需删除"
          fi


      - name: 删除根目录旧XML文件
        run: find . -maxdepth 1 -name "*.xml" -type f -delete

      - name: 下载最新XML
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          curl -L -A "$UA" -o windrawwinfirsthalf.xml "https://www.macauslot.com/content/data/soccer/xml/odds/windrawwinfirsthalf.xml"
          curl -L -A "$UA" -o odds_config.xml "https://www.macauslot.com/content/data/soccer/xml/odds/odds_config.xml"
          curl -L -A "$UA" -o windrawwin.xml "https://www.macauslot.com/content/data/soccer/xml/odds/windrawwin.xml"
          curl -L -A "$UA" -o halffull.xml "https://www.macauslot.com/content/data/soccer/xml/odds/halffull.xml"
          curl -L -A "$UA" -o winodds.xml "https://www.macauslot.com/content/data/soccer/xml/odds/winodds.xml"
          curl -L -A "$UA" -o overunder.xml "https://www.macauslot.com/content/data/soccer/xml/odds/overunder.xml"
          curl -L -A "$UA" -o numberofgoals.xml "https://www.macauslot.com/content/data/soccer/xml/odds/numberofgoals.xml"
          curl -L -A "$UA" -o correctscore.xml "https://www.macauslot.com/content/data/soccer/xml/odds/correctscore.xml"

      - name: 验证下载完整性
        run: |
          ALL_FILES=("windrawwinfirsthalf.xml" "odds_config.xml" "windrawwin.xml" "halffull.xml" "winodds.xml" "overunder.xml" "numberofgoals.xml" "correctscore.xml")
          for f in "${ALL_FILES[@]}"; do
            if [ ! -s "$f" ]; then
              echo "❌ 文件 $f 不存在或为空，下载失败"
              exit 1
            fi
          done
          echo "✅ 所有8个XML文件下载成功"

      - name: 复制XML到HisData时间戳文件夹
        run: |
          ARCHIVE_DIR="HisData/${{ env.TIMESTAMP }}"
          mkdir -p "$ARCHIVE_DIR"
          cp *.xml "$ARCHIVE_DIR/"
          echo "✅ 已复制到 $ARCHIVE_DIR"

      # =============== Python 环境 ===============
      - name: 安装 Python 3.12 并缓存依赖
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖（含 Playwright）
        run: |
          pip install requests==2.32.3 numpy==2.2.4 pandas==2.2.3 playwright
          playwright install chromium
          playwright install-deps

      # =============== 原有分析脚本 ===============
      - name: 生成 his_data.js
        run: python parse_xml.py

      - name: 运行分析脚本
        run: python bc.py

      # =============== 抓取实时比分（livescore） ===============
      - name: 抓取 livescore 数据
        run: python fetch_livescore.py

      # =============== 新增：解析 scores.json 生成 scores_now.csv ===============
      - name: 解析实时比分
        run: python scores_parser.py --input scores.json

      - name: 增量更新统计CSV
        run: python stats_python.py --update --data scripts/docs/his_data.js --output scripts/docs/stats.csv
      
      # =============== 统一提交 ===============
      - name: 统一提交所有生成文件
        uses: EndBug/add-and-commit@v9
        with:
          author_name: Auto Bot
          author_email: bot@example.com
          message: "综合备份 ${{ env.TIMESTAMP }}：XML归档、分析、livescore [skip ci]"
          add: "HisData/ *.xml data/ scripts/docs/his_data.js scripts/docs/stats.csv scores.json scores_now.csv"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # =============== 百度网盘上传（已注释） ===============
      # - name: 打包文件夹（含scores.json）
      #   run: |
      #     zip -r "backup_${{ env.TIMESTAMP }}.zip" HisData scripts/docs data 
      #     echo "UPLOAD_FILE=backup_${{ env.TIMESTAMP }}.zip" >> $GITHUB_ENV
      #     echo "✅ 已打包"

      # - name: 执行百度网盘上传脚本
      #   env:
      #     BAIDU_ACCESS_TOKEN: ${{ secrets.BAIDU_ACCESS_TOKEN }}
      #   run: |
      #     mkdir -p to_upload
      #     cp "${{ env.UPLOAD_FILE }}" to_upload/
      #     python scripts/baidu_upload.py

      # - name: 清理临时文件
      #   run: rm -f "${{ env.UPLOAD_FILE }}" && echo "✅ 清理完成"
