name: 综合备份 & 实时比分抓取

on:
  workflow_dispatch:           # 保留手动触发

jobs:
  process-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 5        # 放宽：缓存失效时留出余量，平时用不到

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置北京时间
        id: set-time
        run: |
          sudo timedatectl set-timezone Asia/Shanghai
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          DATE=$(date +%Y%m%d)
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          echo "DATE=$DATE" >> $GITHUB_ENV

      - name: 创建文件夹结构
        run: |
          mkdir -p HisData docs data

      - name: 删除72小时前的HisData文件夹
        run: |
          cd HisData
          # 子文件夹按时间戳命名，排序后保留最新 24 个（=24小时），删除其余
          mapfile -t dirs < <(ls -d */ 2>/dev/null | sed 's#/$##' | sort)
          total=${#dirs[@]}
          keep=24
          if [ "$total" -gt "$keep" ]; then
            delete_count=$((total - keep))
            for ((i=0; i<delete_count; i++)); do
              echo "删除文件夹: ${dirs[i]}"
              rm -rf "${dirs[i]}"
            done
            echo "已删除 $delete_count 个旧文件夹，保留最新 $keep 个"
          else
            echo "当前共 $total 个文件夹，未超过 $keep 个，无需删除"
          fi

      - name: 删除根目录旧XML文件
        run: find . -maxdepth 1 -name "*.xml" -type f -delete

      - name: 下载最新XML
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          curl -L -A "$UA" -o windrawwinfirsthalf.xml "https://www.macauslot.com/content/data/soccer/xml/odds/windrawwinfirsthalf.xml"
          curl -L -A "$UA" -o odds_config.xml "https://www.macauslot.com/content/data/soccer/xml/odds/odds_config.xml"
          curl -L -A "$UA" -o windrawwin.xml "https://www.macauslot.com/content/data/soccer/xml/odds/windrawwin.xml"
          curl -L -A "$UA" -o halffull.xml "https://www.macauslot.com/content/data/soccer/xml/odds/halffull.xml"
          curl -L -A "$UA" -o winodds.xml "https://www.macauslot.com/content/data/soccer/xml/odds/winodds.xml"
          curl -L -A "$UA" -o overunder.xml "https://www.macauslot.com/content/data/soccer/xml/odds/overunder.xml"
          curl -L -A "$UA" -o numberofgoals.xml "https://www.macauslot.com/content/data/soccer/xml/odds/numberofgoals.xml"
          curl -L -A "$UA" -o correctscore.xml "https://www.macauslot.com/content/data/soccer/xml/odds/correctscore.xml"

      - name: 验证下载完整性
        run: |
          ALL_FILES=("windrawwinfirsthalf.xml" "odds_config.xml" "windrawwin.xml" "halffull.xml" "winodds.xml" "overunder.xml" "numberofgoals.xml" "correctscore.xml")
          for f in "${ALL_FILES[@]}"; do
            if [ ! -s "$f" ]; then
              echo "❌ 文件 $f 不存在或为空，下载失败"
              exit 1
            fi
          done
          echo "✅ 所有8个XML文件下载成功"

      - name: 复制XML到HisData时间戳文件夹
        run: |
          ARCHIVE_DIR="HisData/${{ env.TIMESTAMP }}"
          mkdir -p "$ARCHIVE_DIR"
          cp *.xml "$ARCHIVE_DIR/"
          echo "✅ 已复制到 $ARCHIVE_DIR"

      # ---------- Python 环境（极致加速版） ----------
      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: '3.12'

      - name: 缓存 Python 虚拟环境
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py312-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            venv-${{ runner.os }}-py312-

      - name: 安装 Python 依赖（仅当缓存未命中）
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 将虚拟环境加入 PATH
        run: echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH

      # ---------- Playwright 浏览器缓存（按需） ----------
      - name: 缓存 Playwright 浏览器
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-py312-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-py312-

      - name: 安装 Playwright（命中缓存则完全跳过）
        run: |
          if [[ "${{ steps.playwright-cache.outputs.cache-hit }}" == "true" ]]; then
            echo "✅ 浏览器缓存命中，跳过下载和系统依赖安装（Ubuntu 已预装所需库）"
          else
            echo "❌ 缓存未命中，安装 Chromium 及系统依赖"
            playwright install --with-deps chromium
          fi

      # ---------- 运行分析脚本（原样） ----------
      - name: 生成 his_data.js
        run: python parse_xml.py 

      # - name: 运行分析脚本
      #   run: python bc.py

      - name: 抓取 livescore 数据
        run: python fetch_livescore.py

      - name: 解析实时比分
        run: python scores_parser.py --input scores.json

      # ---------- 完场赛果（仅北京时间 14 点那次运行） ----------
      - name: 抓取 results 数据
        if: ${{ steps.set-time.outputs.hour == '14' }}
        continue-on-error: true
        run: python fetch_results.py

      - name: 解析 results.json 生成 history.csv
        if: ${{ steps.set-time.outputs.hour == '14' }}
        continue-on-error: true
        run: python results_parser.py --input results.json --history history.csv --output history.csv

      - name: 增量更新统计CSV
        run: python stats_python.py --update --order first --data scripts/docs/his_data.js --output scripts/docs/stats.csv

      - name: 运行价值扫描
        env:
          HIS_DATA: scripts/docs/his_data.js
          OUT_CSV: scripts/docs/value_matches.csv
        run: python value_scan.py

      # =============== 统一提交 ===============
      - name: 统一提交所有生成文件
        uses: EndBug/add-and-commit@v9
        with:
          author_name: Auto Bot
          author_email: bot@example.com
          message: "综合备份 ${{ env.TIMESTAMP }}：XML归档、分析、livescore [skip ci]"
          add: "HisData/ scripts/docs/stats.csv scores_now.csv history.csv scripts/docs/value_matches.csv"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # add: "HisData/ *.xml data/ scripts/docs/his_data.js scripts/docs/stats.csv scores_now.csv history.csv scripts/docs/value_matches.csv"
      # =============== 百度网盘上传（已注释） ===============
