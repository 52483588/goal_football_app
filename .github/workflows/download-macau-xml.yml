      #     zip -r "backup_${{ env.TIMESTAMP }}.zip" HisData scripts/docs data
      #     echo "UPLOAD_FILE=backup_${{ env.TIMESTAMP }}.zip" >> $GITHUB_ENV
      #     echo "✅ 已打包"

      # - name: 执行百度网盘上传脚本
      #   env:
      #     BAIDU_ACCESS_TOKEN: ${{ secrets.BAIDU_ACCESS_TOKEN }}
      #   run: |
      #     mkdir -p to_upload
      #     cp "${{ env.UPLOAD_FILE }}" to_upload/
