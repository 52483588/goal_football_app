          #!/usr/bin/env python3
# -*- coding: utf-8 -*-
"""
UC网盘自动上传脚本（完整版）
基于抓包分析：登录 + 分片上传
"""

import os
import sys
import json
import glob
import requests
from pathlib import Path

# 从环境变量读取账号密码
UC_USER = os.environ.get('UC_USER', '')
UC_PWD = os.environ.get('UC_PWD', '')

if not UC_USER or not UC_PWD:
    print("❌ 错误: 未设置 UC_USER 或 UC_PWD 环境变量")
    sys.exit(1)

# 查找要上传的文件
upload_dir = "./to_upload"
files_to_upload = glob.glob(f"{upload_dir}/*.zip")

if not files_to_upload:
    print("❌ 错误: 没有找到要上传的zip文件")
    sys.exit(1)

upload_file = files_to_upload[0]
file_size = os.path.getsize(upload_file)
file_name = os.path.basename(upload_file)
print(f"📦 找到文件: {file_name} ({file_size / 1024 / 1024:.2f} MB)")

def login_uc():
    """登录 UC 网盘，返回 session 和 token"""
    
    login_url = "https://api.open.uc.cn/cas/custom/login/commit?custom_login_type=common"
    
    session = requests.Session()
    session.headers.update({
        'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
        'Referer': 'https://drive.uc.cn/',
        'Origin': 'https://drive.uc.cn',
        'Content-Type': 'application/x-www-form-urlencoded'
    })
    
    login_data = {
        "login_name": UC_USER,
        "password": UC_PWD,
        "remember": "true"
    }
    
    print(f"🔐 正在登录 UC 网盘...")
    
    resp = session.post(login_url, data=login_data)
    
    if resp.status_code == 200:
        result = resp.json()
        if result.get('status') == 20000:
            token = result.get('data')
            print(f"✅ 登录成功")
            return session, token
        else:
            print(f"❌ 登录失败: {result}")
            return None, None
    else:
        print(f"❌ 登录请求失败: HTTP {resp.status_code}")
        return None, None

def get_upload_pre(session, token, file_path):
    """获取上传预处理信息"""
    
    pre_url = "https://pc-api.uc.cn/1/clouddrive/file/upload/pre?pr=UCBrowser&fr=pc"
    
    session.headers.update({
        'Authorization': f'Bearer {token}',
        'Content-Type': 'application/json',
        'Accept': 'application/json'
    })
    
    file_size = os.path.getsize(file_path)
    file_name = os.path.basename(file_path)
    
    # 根据抓包数据构建请求体
    payload = {
        "name": file_name,
        "size": file_size,
        "parent_id": "root",  # 上传到根目录
        "check_name_mode": "auto_rename",  # 重名时自动重命名
        "type": "file",
        "file_struct": {
            "platform_source": "pc"
        }
    }
    
    print(f"📡 获取上传预处理信息...")
    resp = session.post(pre_url, json=payload)
    
    if resp.status_code == 200:
        result = resp.json()
        if result.get('code') == 0:
            data = result.get('data', {})
            print(f"✅ 预处理成功，upload_id: {data.get('upload_id')}")
            return data
        else:
            print(f"❌ 预处理失败: {result}")
            return None
    else:
        print(f"❌ 预处理请求失败: HTTP {resp.status_code}")
        return None

def upload_file_content(upload_info, file_path):
    """上传文件内容到 PDS 存储"""
    
    upload_url = upload_info.get('upload_url')
    obj_key = upload_info.get('obj_key')
    upload_id = upload_info.get('upload_id')
    auth_info = upload_info.get('auth_info')
    
    if not upload_url or not obj_key:
        print("❌ 缺少上传必要信息")
        return False
    
    # 构建完整的上传 URL
    full_upload_url = f"{upload_url}/{obj_key}"
    
    # 上传请求头
    headers = {
        'Authorization': auth_info,
        'Content-Type': 'application/octet-stream',
        'Content-Length': str(os.path.getsize(file_path))
    }
    
    print(f"📤 正在上传文件内容到: {full_upload_url[:50]}...")
    
    try:
        with open(file_path, 'rb') as f:
            file_data = f.read()
        
        resp = requests.put(full_upload_url, data=file_data, headers=headers)
        
        if resp.status_code in [200, 201]:
            print(f"✅ 文件内容上传成功 (HTTP {resp.status_code})")
            return True
        else:
            print(f"❌ 上传失败: HTTP {resp.status_code}")
            print(f"   响应: {resp.text[:200]}")
            return False
    except Exception as e:
        print(f"❌ 上传异常: {e}")
        return False

def complete_upload(session, token, upload_info):
    """完成上传，通知服务器"""
    
    complete_url = "https://pc-api.uc.cn/1/clouddrive/file/upload/complete?pr=UCBrowser&fr=pc"
    
    payload = {
        "upload_id": upload_info.get('upload_id'),
        "obj_key": upload_info.get('obj_key'),
        "name": upload_info.get('name', ''),
        "parent_id": "root",
        "size": upload_info.get('size'),
        "file_struct": {
            "platform_source": "pc"
        }
    }
    
    print(f"📡 完成上传确认...")
    resp = session.post(complete_url, json=payload)
    
    if resp.status_code == 200:
        result = resp.json()
        if result.get('code') == 0:
            print(f"✅ 上传完成确认成功")
            return True
        else:
            print(f"⚠️ 确认响应: {result}")
            return True  # 即使确认失败，文件可能已上传成功
    else:
        print(f"⚠️ 确认请求失败: HTTP {resp.status_code}")
        return True  # 文件内容已上传，这里失败不影响

# ==================== 主流程 ====================

print("=" * 50)
print("UC 网盘自动上传脚本启动")
print("=" * 50)

# 1. 登录
session, token = login_uc()
if not session or not token:
    print("❌ 登录失败，退出")
    sys.exit(1)

# 2. 获取上传预处理信息
upload_info = get_upload_pre(session, token, upload_file)
if not upload_info:
    print("❌ 获取上传预处理失败，退出")
    sys.exit(1)

# 添加上传需要的额外信息
upload_info['name'] = file_name
upload_info['size'] = file_size

# 3. 上传文件内容
if not upload_file_content(upload_info, upload_file):
    print("❌ 文件内容上传失败，退出")
    sys.exit(1)

# 4. 完成上传确认
complete_upload(session, token, upload_info)

print("=" * 50)
print(f"✅ 文件 {file_name} 上传 UC 网盘完成")
print("=" * 50)

# 输出上传结果供后续步骤使用
with open(os.environ.get('GITHUB_ENV', '/tmp/github_env'), 'a') as f:
    f.write(f"UPLOADED_FILE={file_name}\n")
    f.write(f"UPLOAD_SIZE={file_size}\n")

sys.exit(0)

      # ========== 微信通知（方式二） ==========
      - name: 发送微信通知
        env:
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
          UPLOAD_DATE: ${{ needs.process-files.outputs.date }}
          UPLOAD_TIME: ${{ needs.process-files.outputs.timestamp }}
        run: |
          if [ -z "$WECHAT_WEBHOOK" ]; then
            echo "⚠️ 未配置 WECHAT_WEBHOOK，跳过微信通知"
            exit 0
          fi
          
          # 获取文件大小信息
          FILE_SIZE=$(ls -lh ./to_upload/*.zip 2>/dev/null | awk '{print $5}')
          
          # 构建通知内容
          MESSAGE="【定时备份通知】\n\n"
          MESSAGE="${MESSAGE}✅ 备份任务执行成功\n"
          MESSAGE="${MESSAGE}📅 备份时间: ${UPLOAD_TIME}\n"
          MESSAGE="${MESSAGE}📦 备份内容: HisData / docs / data\n"
          MESSAGE="${MESSAGE}💾 文件大小: ${FILE_SIZE:-未知}\n"
          MESSAGE="${MESSAGE}☁️ 存储位置: UC网盘\n"
          MESSAGE="${MESSAGE}🔗 分享链接: 请登录UC网盘查看"
          
          # 发送到微信（通过企业微信机器人或PushPlus）
          # 方案1: 使用 PushPlus (免费，支持个人微信)
          PUSHPLUS_TOKEN="${{ secrets.PUSHPLUS_TOKEN }}"
          if [ -n "$PUSHPLUS_TOKEN" ]; then
            curl -s -X POST "http://www.pushplus.plus/send" \
              -H "Content-Type: application/json" \
              -d "{\"token\":\"${PUSHPLUS_TOKEN}\",\"title\":\"定时备份通知\",\"content\":\"${MESSAGE}\"}"
            echo "✅ 已通过 PushPlus 发送微信通知"
          fi
          
          # 方案2: 使用企业微信机器人
          if [ -n "$WECHAT_WEBHOOK" ]; then
            curl -s -X POST "$WECHAT_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"${MESSAGE}\"}}"
            echo "✅ 已通过企业微信机器人发送通知"
          fi
