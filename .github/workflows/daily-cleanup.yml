name: 每日数据清理与备份

on:

  workflow_dispatch:          # 保留手动触发

jobs:
  daily-process:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      # ===========================================
      # 处理 /data 文件夹
      # ===========================================
      - name: 处理 /data 文件夹
        run: |
          cd data
          
          TWO_DAYS_AGO=$(date -d '2 days ago' +%Y%m%d)
          echo "2天前日期: $TWO_DAYS_AGO"
          
          for file in analysis_output_[0-9]*.json; do
            if [[ -f "$file" ]]; then
              filename=$(basename "$file")
              date_part=$(echo "$filename" | sed -n 's/analysis_output_\([0-9]\{8\}\).*/\1/p')
              
              if [[ -n "$date_part" && "$date_part" -lt "$TWO_DAYS_AGO" ]]; then
                echo "删除文件: $file (日期: $date_part)"
                rm -f "$file"
              fi
            fi
          done

      # ===========================================
      # 提交并推送
      # ===========================================
      - name: 提交并推送更改
        run: |
          git add -A
          git status
          git commit -m "Cleanup: 每日清理任务 - $(date +%Y-%m-%d)" 2>/dev/null || echo "无变更需要提交"
          git push origin HEAD || echo "推送失败"
