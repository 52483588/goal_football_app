<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大小球 EV 分析工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            background: #f0f4f8;
            color: #1a2332;
            padding: 24px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #0b1a2b;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .subtitle {
            color: #4a5a6e;
            font-size: 15px;
            margin-bottom: 24px;
            border-left: 4px solid #2b6c9e;
            padding-left: 16px;
            background: #e8edf3;
            border-radius: 0 8px 8px 0;
            line-height: 1.6;
        }
        .card {
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            padding: 20px 24px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
            transition: box-shadow 0.2s;
        }
        .card:hover {
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }
        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #0b1a2b;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-title .step-badge {
            display: inline-block;
            background: #1a3a5e;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 20px;
            letter-spacing: 0.3px;
        }
        .card-title .step-badge.green {
            background: #1f7b4d;
        }
        .card-title .step-badge.orange {
            background: #b45f1b;
        }
        .card-title .step-badge.purple {
            background: #6b3f8b;
        }
        .card-title .step-badge.teal {
            background: #0d6b7a;
        }
        textarea {
            width: 100%;
            height: 110px;
            padding: 14px 16px;
            font-size: 14px;
            font-family: 'Consolas', 'Courier New', monospace;
            border: 2px solid #d0d8e0;
            border-radius: 10px;
            background: #fafcfe;
            resize: vertical;
            transition: border-color 0.2s;
            color: #1a2332;
            line-height: 1.7;
        }
        textarea:focus {
            outline: none;
            border-color: #2b6c9e;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(43, 108, 158, 0.12);
        }
        .input-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
            align-items: center;
        }
        .btn {
            padding: 8px 22px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-primary {
            background: #1a3a5e;
            color: #fff;
        }
        .btn-primary:hover {
            background: #0f2a45;
        }
        .btn-secondary {
            background: #e2e8f0;
            color: #1a2332;
        }
        .btn-secondary:hover {
            background: #d0d8e2;
        }
        .btn-success {
            background: #1f7b4d;
            color: #fff;
        }
        .btn-success:hover {
            background: #16643d;
        }
        .btn-outline {
            background: transparent;
            color: #2b6c9e;
            border: 2px solid #2b6c9e;
        }
        .btn-outline:hover {
            background: #eef4fa;
        }
        .btn-danger-outline {
            background: transparent;
            color: #b33636;
            border: 2px solid #b33636;
        }
        .btn-danger-outline:hover {
            background: #fce8e8;
        }
        .badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        .badge-red {
            background: #fde8e8;
            color: #b33636;
        }
        .badge-green {
            background: #e4f5ec;
            color: #1a6e42;
        }
        .badge-blue {
            background: #e3eef9;
            color: #1a4e7a;
        }
        .badge-gold {
            background: #fcf3e0;
            color: #9e6d1b;
        }
        .badge-gray {
            background: #eef1f4;
            color: #4a5a6e;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 700px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            margin-top: 6px;
        }
        table th {
            text-align: left;
            background: #f2f5f9;
            padding: 8px 12px;
            font-weight: 600;
            color: #1a2a3e;
            border-bottom: 2px solid #dce2ea;
        }
        table td {
            padding: 7px 12px;
            border-bottom: 1px solid #eaeef4;
        }
        table tr:last-child td {
            border-bottom: none;
        }
        .table-highlight {
            background: #f8fafc;
        }
        .ev-positive {
            color: #1a7a4a;
            font-weight: 700;
        }
        .ev-negative {
            color: #b33636;
            font-weight: 700;
        }
        .ev-neutral {
            color: #9e6d1b;
            font-weight: 700;
        }
        .result-box {
            padding: 14px 18px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 15px;
            line-height: 1.7;
        }
        .result-box.success {
            background: #e4f5ec;
            border-left: 5px solid #1f7b4d;
        }
        .result-box.warning {
            background: #fcf3e0;
            border-left: 5px solid #b45f1b;
        }
        .result-box.danger {
            background: #fde8e8;
            border-left: 5px solid #b33636;
        }
        .result-box.info {
            background: #e3eef9;
            border-left: 5px solid #2b6c9e;
        }
        .conclusion-box {
            background: #f0f4fb;
            border-radius: 12px;
            padding: 18px 22px;
            margin-top: 12px;
            border: 1px solid #d5e0ec;
        }
        .conclusion-box .big-label {
            font-size: 22px;
            font-weight: 700;
        }
        .inline-code {
            background: #eef2f6;
            padding: 1px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mt-12 {
            margin-top: 12px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .text-muted {
            color: #5a6a7e;
            font-size: 14px;
        }
        .divider {
            border: none;
            border-top: 2px dashed #dce2ea;
            margin: 14px 0;
        }
        .chip {
            display: inline-block;
            background: #eef2f6;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: #1a2a3e;
        }
        .tag {
            display: inline-block;
            background: #1a3a5e;
            color: #fff;
            padding: 0 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            line-height: 22px;
        }
        .tag.green {
            background: #1f7b4d;
        }
        .tag.orange {
            background: #b45f1b;
        }
        .tag.red {
            background: #b33636;
        }
        .tag.gray {
            background: #5a6a7e;
        }
        .footnote {
            font-size: 13px;
            color: #5a6a7e;
            margin-top: 6px;
            border-top: 1px solid #eaeef4;
            padding-top: 10px;
        }
        .empty-state {
            color: #7a8a9e;
            text-align: center;
            padding: 30px 10px;
            font-size: 16px;
        }
        .highlight-cell {
            font-weight: 600;
        }
        .bar-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 2px 0;
        }
        .bar-bg {
            flex: 1;
            height: 8px;
            background: #eaeef4;
            border-radius: 6px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.4s;
        }
        .bar-fill.green {
            background: #1f7b4d;
        }
        .bar-fill.red {
            background: #b33636;
        }
        .bar-fill.gold {
            background: #b45f1b;
        }
        .bar-fill.blue {
            background: #2b6c9e;
        }
        .bar-label {
            min-width: 50px;
            text-align: right;
            font-weight: 500;
            font-size: 14px;
        }
        #resultArea {
            display: none;
        }
        #resultArea.visible {
            display: block;
        }
        .example-hint {
            font-size: 13px;
            color: #5a6a7e;
            background: #f2f5f9;
            padding: 6px 14px;
            border-radius: 6px;
            display: inline-block;
            cursor: pointer;
            transition: background 0.2s;
        }
        .example-hint:hover {
            background: #e2e8f0;
        }
        @media print {
            body {
                background: #fff;
                padding: 12px;
            }
            .card {
                box-shadow: none;
                border: 1px solid #ccc;
                break-inside: avoid;
            }
            .btn {
                display: none;
            }
            textarea {
                border: 1px solid #aaa;
            }
        }
        .fade-in {
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="flex-between" style="margin-bottom:6px;">
            <h1>⚽ 大小球 EV 分析工具</h1>
            <span style="font-size:14px;color:#4a5a6e;">v1.0 · 泊松分布校准</span>
        </div>
        <div class="subtitle">
            粘贴数据 → 自动解析 → 四步分析 → 投注建议<br>
            <span style="font-size:13px;color:#5a6a7e;">支持 整数盘 · 半球盘 · 四分之一盘 · 四分之三盘</span>
        </div>

        <!-- ===== 输入区 ===== -->
        <div class="card">
            <div class="card-title">
                📋 数据输入
                <span style="font-size:13px;font-weight:400;color:#5a6a7e;margin-left:6px;">粘贴下方数据（制表符/空格分隔）</span>
            </div>
            <textarea id="inputData" placeholder="粘贴数据…&#10;示例：&#10;0	1	2	3	4	5	6	7	大	盘口	小&#10;0.094	0.222	0.263	0.207	0.122	0.058	0.023	0.011	1.86	2.25	1.94"></textarea>
            <div class="input-actions">
                <button class="btn btn-primary" onclick="analyze()">🚀 计算分析</button>
                <button class="btn btn-secondary" onclick="loadExample()">📌 加载示例</button>
                <button class="btn btn-danger-outline" onclick="clearAll()">✕ 清空</button>
                <span class="example-hint" onclick="loadExample()">点击加载示例数据</span>
            </div>
        </div>

        <!-- ===== 结果区 ===== -->
        <div id="resultArea">
            <!-- 第一步 -->
            <div class="card fade-in" id="step1">
                <div class="card-title"><span class="step-badge">第一步</span> 数据与盘口拆解</div>
                <div id="step1Content"></div>
            </div>

            <!-- 第二步 -->
            <div class="card fade-in" id="step2">
                <div class="card-title"><span class="step-badge green">第二步</span> 精确计算期望价值 (EV)</div>
                <div id="step2Content"></div>
            </div>

            <!-- 第三步 -->
            <div class="card fade-in" id="step3">
                <div class="card-title"><span class="step-badge orange">第三步</span> 价值投注视角 <span style="font-size:13px;font-weight:400;color:#5a6a7e;">剔除走水 / 半输影响</span></div>
                <div id="step3Content"></div>
            </div>

            <!-- 第四步 -->
            <div class="card fade-in" id="step4">
                <div class="card-title"><span class="step-badge purple">第四步</span> 结论 · 单次下注建议</div>
                <div id="step4Content"></div>
            </div>
        </div>

        <div style="text-align:center;color:#7a8a9e;font-size:13px;padding:20px 0 6px;border-top:1px solid #e2e8f0;margin-top:8px;">
            数据仅用于分析参考 · 投注有风险，请理性决策
        </div>
    </div>

    <script>
        // ============================================================
        //  核心工具函数
        // ============================================================

        function parseData(text) {
    // 1. 提取所有数字（包括整数和小数，忽略百分号、负号等）
    const numRegex = /\d+\.?\d*/g;
    const numbers = [];
    let match;
    while ((match = numRegex.exec(text)) !== null) {
        numbers.push(parseFloat(match[0]));
    }

    if (numbers.length < 21) {
        throw new Error('提取的数字不足21个，请确认数据格式是否正确。');
    }

    // 2. 根据固定位置索引取值（0-based）
    const indices = [0, 2, 4, 6, 8, 10, 12, 14, 18, 26, 22];
    const selected = indices.map(i => numbers[i]);

    // 3. 前8个为进球概率（原始为百分比，需除以100）
    const probs = selected.slice(0, 8).map(v => v / 100);
    const overOdds = selected[8];   // 大球赔率
    const handicap = selected[9];   // 盘口
    const underOdds = selected[10]; // 小球赔率

    // 4. 概率和校验
    const total = probs.reduce((a, b) => a + b, 0);
    if (Math.abs(total - 1) > 0.01) {
        console.warn('概率之和不为1，实际为:', total);
    }

    return { probs, overOdds, handicap, underOdds };
}

        // ---------- 累积概率 ----------
        function cumProb(probs, from, to) {
            // from, to 为整数，包含两端；to 可为 'inf' 表示到 7+
            if (to === 'inf') {
                let s = 0;
                for (let i = from; i < probs.length; i++) s += probs[i];
                return s;
            }
            let s = 0;
            for (let i = from; i <= to; i++) s += probs[i];
            return s;
        }

        // ---------- 盘口拆解信息 ----------
        function getHandicapInfo(handicap) {
            const intPart = Math.floor(handicap);
            const frac = Math.round((handicap - intPart) * 100) / 100;
            let type = '';
            let description = '';
            let lo = null,
                hi = null;

            if (Math.abs(frac - 0.5) < 0.01) {
                type = '半球盘';
                description = `盘口 ${handicap.toFixed(1)} 属于半球盘，无走水，直接分出胜负。`;
            } else if (Math.abs(frac) < 0.01) {
                type = '整数盘';
                description = `盘口 ${handicap.toFixed(1)} 属于整数盘，当进球数 = ${intPart} 时走水（本金退还）。`;
            } else if (Math.abs(frac - 0.25) < 0.01) {
                type = '四分之一盘';
                lo = intPart;
                hi = intPart + 0.5;
                description =
                `盘口 ${handicap.toFixed(2)} 属于四分之一盘，拆解为：50% ${lo.toFixed(1)}盘 + 50% ${hi.toFixed(1)}盘。`;
            } else if (Math.abs(frac - 0.75) < 0.01) {
                type = '四分之三盘';
                lo = intPart + 0.5;
                hi = intPart + 1.0;
                description =
                `盘口 ${handicap.toFixed(2)} 属于四分之三盘，拆解为：50% ${lo.toFixed(1)}盘 + 50% ${hi.toFixed(1)}盘。`;
            } else {
                // 兜底：按最近的类型处理
                if (frac < 0.25) { type = '整数盘(近似)';
                    description = `盘口 ${handicap.toFixed(2)} 近似为整数盘处理。`; } else if (frac < 0.5) { type =
                        '四分之一盘(近似)';
                    description = `盘口 ${handicap.toFixed(2)} 近似为四分之一盘处理。`;
                    lo = intPart;
                    hi = intPart + 0.5; } else if (frac < 0.75) { type = '半球盘(近似)';
                    description = `盘口 ${handicap.toFixed(2)} 近似为半球盘处理。`; } else { type = '四分之三盘(近似)';
                    description = `盘口 ${handicap.toFixed(2)} 近似为四分之三盘处理。`;
                    lo = intPart + 0.5;
                    hi = intPart + 1.0; }
            }

            return { type, description, lo, hi, intPart, frac };
        }

        // ---------- 计算单个盘口的 EV（用于拆解） ----------
        function calcSingleEV(probs, handicap, overOdds, underOdds) {
            const intPart = Math.floor(handicap);
            const frac = Math.round((handicap - intPart) * 100) / 100;

            let pOver = 0,
                pPush = 0,
                pUnder = 0;
            let overWinHalf = 0,
                underWinHalf = 0;
            let overLoseHalf = 0,
                underLoseHalf = 0;

            // 为了展示详细区间，我们构建一个区间列表
            const ranges = [];

            if (Math.abs(frac - 0.5) < 0.01) {
                // 半球盘
                const threshold = intPart; // 如2.5，<=2输，>=3赢
                const pLow = cumProb(probs, 0, threshold);
                const pHigh = cumProb(probs, threshold + 1, 'inf');
                pOver = pHigh;
                pUnder = pLow;
                ranges.push({ label: `≤ ${threshold} 球`, prob: pLow, type: 'under' });
                ranges.push({ label: `≥ ${threshold + 1} 球`, prob: pHigh, type: 'over' });
            } else if (Math.abs(frac) < 0.01) {
                // 整数盘
                const threshold = intPart;
                const pLow = cumProb(probs, 0, threshold - 1);
                const pMid = cumProb(probs, threshold, threshold);
                const pHigh = cumProb(probs, threshold + 1, 'inf');
                pOver = pHigh;
                pPush = pMid;
                pUnder = pLow;
                ranges.push({ label: `≤ ${threshold - 1} 球`, prob: pLow, type: 'under' });
                ranges.push({ label: `= ${threshold} 球`, prob: pMid, type: 'push' });
                ranges.push({ label: `≥ ${threshold + 1} 球`, prob: pHigh, type: 'over' });
            } else if (Math.abs(frac - 0.25) < 0.01) {
                // 四分之一盘：拆解为 intPart 和 intPart+0.5
                const r1 = calcSingleEV(probs, intPart, overOdds, underOdds);
                const r2 = calcSingleEV(probs, intPart + 0.5, overOdds, underOdds);
                // 加权平均
                const avg = (a, b) => (a + b) / 2;
                return {
                    pOver: avg(r1.pOver, r2.pOver),
                    pPush: avg(r1.pPush, r2.pPush),
                    pUnder: avg(r1.pUnder, r2.pUnder),
                    overWinHalf: avg(r1.overWinHalf, r2.overWinHalf),
                    underWinHalf: avg(r1.underWinHalf, r2.underWinHalf),
                    overLoseHalf: avg(r1.overLoseHalf, r2.overLoseHalf),
                    underLoseHalf: avg(r1.underLoseHalf, r2.underLoseHalf),
                    ranges: r1.ranges.concat(r2.ranges).map((r, idx) => ({ ...r, prob: (r.prob + (r2.ranges[idx] ?
                            r2.ranges[idx].prob : 0)) / 2 })),
                    isComposite: true,
                    lo: intPart,
                    hi: intPart + 0.5
                };
            } else if (Math.abs(frac - 0.75) < 0.01) {
                // 四分之三盘：拆解为 intPart+0.5 和 intPart+1.0
                const r1 = calcSingleEV(probs, intPart + 0.5, overOdds, underOdds);
                const r2 = calcSingleEV(probs, intPart + 1.0, overOdds, underOdds);
                const avg = (a, b) => (a + b) / 2;
                return {
                    pOver: avg(r1.pOver, r2.pOver),
                    pPush: avg(r1.pPush, r2.pPush),
                    pUnder: avg(r1.pUnder, r2.pUnder),
                    overWinHalf: avg(r1.overWinHalf, r2.overWinHalf),
                    underWinHalf: avg(r1.underWinHalf, r2.underWinHalf),
                    overLoseHalf: avg(r1.overLoseHalf, r2.overLoseHalf),
                    underLoseHalf: avg(r1.underLoseHalf, r2.underLoseHalf),
                    ranges: r1.ranges.concat(r2.ranges).map((r, idx) => ({ ...r, prob: (r.prob + (r2.ranges[idx] ?
                            r2.ranges[idx].prob : 0)) / 2 })),
                    isComposite: true,
                    lo: intPart + 0.5,
                    hi: intPart + 1.0
                };
            } else {
                // fallback
                const threshold = Math.round(handicap);
                const pLow = cumProb(probs, 0, threshold - 1);
                const pMid = cumProb(probs, threshold, threshold);
                const pHigh = cumProb(probs, threshold + 1, 'inf');
                pOver = pHigh;
                pPush = pMid;
                pUnder = pLow;
                ranges.push({ label: `≤ ${threshold - 1} 球`, prob: pLow, type: 'under' });
                ranges.push({ label: `= ${threshold} 球`, prob: pMid, type: 'push' });
                ranges.push({ label: `≥ ${threshold + 1} 球`, prob: pHigh, type: 'over' });
            }

            return { pOver, pPush, pUnder, overWinHalf, underWinHalf, overLoseHalf, underLoseHalf, ranges,
            isComposite: false };
        }

        // ---------- 计算 EV 并返回详细结果 ----------
        function computeEV(probs, overOdds, underOdds, handicap) {
            const info = getHandicapInfo(handicap);

            // 使用 calcSingleEV 获得概率
            let result = calcSingleEV(probs, handicap, overOdds, underOdds);

            // 如果 result 是复合盘口（0.25/0.75），已通过递归计算了概率，但 ranges 可能不准确
            // 我们重新构建精确的区间描述
            const intPart = Math.floor(handicap);
            const frac = Math.round((handicap - intPart) * 100) / 100;

            let detailOver = [];
            let detailUnder = [];

            let pOver = result.pOver;
            let pPush = result.pPush || 0;
            let pUnder = result.pUnder;

            let overWinHalf = result.overWinHalf || 0;
            let underWinHalf = result.underWinHalf || 0;
            let overLoseHalf = result.overLoseHalf || 0;
            let underLoseHalf = result.underLoseHalf || 0;

            // 对于复合盘口，重新构建精确的区间描述
            if (Math.abs(frac - 0.25) < 0.01) {
                // 2.25 盘：0-1全输，2输半，3+全赢
                const p0_1 = cumProb(probs, 0, 1);
                const p2 = cumProb(probs, 2, 2);
                const p3p = cumProb(probs, 3, 'inf');
                pOver = p3p;
                pUnder = p0_1;
                overLoseHalf = p2;
                underWinHalf = p2;
                detailOver = [
                    { label: '0 ~ 1 球', prob: p0_1, outcome: '全输', factor: -1 },
                    { label: '2 球', prob: p2, outcome: '输一半', factor: -0.5 },
                    { label: '3 球及以上', prob: p3p, outcome: '全赢', factor: 1 }
                ];
                detailUnder = [
                    { label: '0 ~ 1 球', prob: p0_1, outcome: '全赢', factor: 1 },
                    { label: '2 球', prob: p2, outcome: '赢一半', factor: 0.5 },
                    { label: '3 球及以上', prob: p3p, outcome: '全输', factor: -1 }
                ];
                // 修正 pPush
                pPush = 0;
            } else if (Math.abs(frac - 0.75) < 0.01) {
                // 2.75 盘：0-2全输，3赢一半，4+全赢
                const p0_2 = cumProb(probs, 0, 2);
                const p3 = cumProb(probs, 3, 3);
                const p4p = cumProb(probs, 4, 'inf');
                pOver = p4p;
                pUnder = p0_2;
                overWinHalf = p3;
                underLoseHalf = p3;
                detailOver = [
                    { label: '0 ~ 2 球', prob: p0_2, outcome: '全输', factor: -1 },
                    { label: '3 球', prob: p3, outcome: '赢一半', factor: 0.5 },
                    { label: '4 球及以上', prob: p4p, outcome: '全赢', factor: 1 }
                ];
                detailUnder = [
                    { label: '0 ~ 2 球', prob: p0_2, outcome: '全赢', factor: 1 },
                    { label: '3 球', prob: p3, outcome: '输一半', factor: -0.5 },
                    { label: '4 球及以上', prob: p4p, outcome: '全输', factor: -1 }
                ];
                pPush = 0;
            } else if (Math.abs(frac - 0.5) < 0.01) {
                // 半球盘
                const threshold = intPart;
                const pLow = cumProb(probs, 0, threshold);
                const pHigh = cumProb(probs, threshold + 1, 'inf');
                pOver = pHigh;
                pUnder = pLow;
                pPush = 0;
                detailOver = [
                    { label: `≤ ${threshold} 球`, prob: pLow, outcome: '全输', factor: -1 },
                    { label: `≥ ${threshold + 1} 球`, prob: pHigh, outcome: '全赢', factor: 1 }
                ];
                detailUnder = [
                    { label: `≤ ${threshold} 球`, prob: pLow, outcome: '全赢', factor: 1 },
                    { label: `≥ ${threshold + 1} 球`, prob: pHigh, outcome: '全输', factor: -1 }
                ];
            } else if (Math.abs(frac) < 0.01) {
                // 整数盘
                const threshold = intPart;
                const pLow = cumProb(probs, 0, threshold - 1);
                const pMid = cumProb(probs, threshold, threshold);
                const pHigh = cumProb(probs, threshold + 1, 'inf');
                pOver = pHigh;
                pPush = pMid;
                pUnder = pLow;
                detailOver = [
                    { label: `≤ ${threshold - 1} 球`, prob: pLow, outcome: '全输', factor: -1 },
                    { label: `= ${threshold} 球`, prob: pMid, outcome: '走水', factor: 0 },
                    { label: `≥ ${threshold + 1} 球`, prob: pHigh, outcome: '全赢', factor: 1 }
                ];
                detailUnder = [
                    { label: `≤ ${threshold - 1} 球`, prob: pLow, outcome: '全赢', factor: 1 },
                    { label: `= ${threshold} 球`, prob: pMid, outcome: '走水', factor: 0 },
                    { label: `≥ ${threshold + 1} 球`, prob: pHigh, outcome: '全输', factor: -1 }
                ];
            } else {
                // fallback
                const threshold = Math.round(handicap);
                const pLow = cumProb(probs, 0, threshold - 1);
                const pMid = cumProb(probs, threshold, threshold);
                const pHigh = cumProb(probs, threshold + 1, 'inf');
                pOver = pHigh;
                pPush = pMid;
                pUnder = pLow;
                detailOver = [
                    { label: `≤ ${threshold - 1} 球`, prob: pLow, outcome: '全输', factor: -1 },
                    { label: `= ${threshold} 球`, prob: pMid, outcome: '走水', factor: 0 },
                    { label: `≥ ${threshold + 1} 球`, prob: pHigh, outcome: '全赢', factor: 1 }
                ];
                detailUnder = [
                    { label: `≤ ${threshold - 1} 球`, prob: pLow, outcome: '全赢', factor: 1 },
                    { label: `= ${threshold} 球`, prob: pMid, outcome: '走水', factor: 0 },
                    { label: `≥ ${threshold + 1} 球`, prob: pHigh, outcome: '全输', factor: -1 }
                ];
            }

            // 计算 EV
            const overNet = overOdds - 1;
            const underNet = underOdds - 1;

            // 大球 EV：根据详细区间计算
            let evOver = 0;
            for (const d of detailOver) {
                if (d.factor === 1) evOver += d.prob * overNet;
                else if (d.factor === -1) evOver += d.prob * (-1);
                else if (d.factor === -0.5) evOver += d.prob * (-0.5);
                else if (d.factor === 0.5) evOver += d.prob * (overNet / 2);
                // factor === 0 无贡献
            }

            let evUnder = 0;
            for (const d of detailUnder) {
                if (d.factor === 1) evUnder += d.prob * underNet;
                else if (d.factor === -1) evUnder += d.prob * (-1);
                else if (d.factor === -0.5) evUnder += d.prob * (-0.5);
                else if (d.factor === 0.5) evUnder += d.prob * (underNet / 2);
            }

            // 公平概率
            const fairOver = (1 / overOdds) / (1 / overOdds + 1 / underOdds);
            const fairUnder = (1 / underOdds) / (1 / overOdds + 1 / underOdds);

            // 等效真实概率（剔除走水 / 半输影响）
            // 对于大球：等效胜率 = (全赢概率 + 0.5*赢半概率) / (全赢 + 0.5*赢半 + 全输 + 0.5*输半)
            // 对于小球：等效胜率 = (全赢概率 + 0.5*赢半概率) / (全赢 + 0.5*赢半 + 全输 + 0.5*输半)
            let overWinFull = 0,
                overWinHalfP = 0,
                overLoseFull = 0,
                overLoseHalfP = 0;
            let underWinFull = 0,
                underWinHalfP = 0,
                underLoseFull = 0,
                underLoseHalfP = 0;

            for (const d of detailOver) {
                if (d.factor === 1) overWinFull += d.prob;
                else if (d.factor === 0.5) overWinHalfP += d.prob;
                else if (d.factor === -1) overLoseFull += d.prob;
                else if (d.factor === -0.5) overLoseHalfP += d.prob;
            }
            for (const d of detailUnder) {
                if (d.factor === 1) underWinFull += d.prob;
                else if (d.factor === 0.5) underWinHalfP += d.prob;
                else if (d.factor === -1) underLoseFull += d.prob;
                else if (d.factor === -0.5) underLoseHalfP += d.prob;
            }

            const overEffWin = overWinFull + 0.5 * overWinHalfP;
            const overEffLose = overLoseFull + 0.5 * overLoseHalfP;
            const underEffWin = underWinFull + 0.5 * underWinHalfP;
            const underEffLose = underLoseFull + 0.5 * underLoseHalfP;

            const overEffProb = (overEffWin + overEffLose) > 0 ? overEffWin / (overEffWin + overEffLose) : 0;
            const underEffProb = (underEffWin + underEffLose) > 0 ? underEffWin / (underEffWin + underEffLose) : 0;

            // 如果全是走水，处理
            const overEffProbFinal = isNaN(overEffProb) ? 0 : overEffProb;
            const underEffProbFinal = isNaN(underEffProb) ? 0 : underEffProb;

            return {
                handicap,
                info,
                overOdds,
                underOdds,
                overNet,
                underNet,
                pOver,
                pPush,
                pUnder,
                detailOver,
                detailUnder,
                evOver,
                evUnder,
                fairOver,
                fairUnder,
                overEffProb: overEffProbFinal,
                underEffProb: underEffProbFinal,
                overWinFull,
                overWinHalfP,
                overLoseFull,
                overLoseHalfP,
                underWinFull,
                underWinHalfP,
                underLoseFull,
                underLoseHalfP,
                // 保存原始概率用于展示
                probs
            };
        }

        // ============================================================
        //  渲染函数
        // ============================================================

        function fmtP(v) {
            return (v * 100).toFixed(2) + '%';
        }

        function fmtNum(v, d = 4) {
            return Number(v).toFixed(d);
        }

        function fmtOdds(v) {
            return v.toFixed(2);
        }

        function renderStep1(data) {
            const { probs, overOdds, underOdds, handicap, info } = data;
            let html = '';

            // 概率分布
            html += `<div class="flex-between mb-8"><span style="font-weight:600;">📊 进球概率分布</span>
                      <span class="chip">总和 ${(probs.reduce((a,b)=>a+b,0)*100).toFixed(2)}%</span></div>`;
            html += `<div style="display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:12px;">`;
            const labels = ['0球', '1球', '2球', '3球', '4球', '5球', '6球', '7+球'];
            for (let i = 0; i < probs.length; i++) {
                const pct = (probs[i] * 100).toFixed(2);
                html += `<span style="background:#eef2f6;padding:2px 12px;border-radius:20px;font-size:14px;">
                            <strong>${labels[i]}</strong> ${pct}%</span>`;
            }
            html += `</div>`;

            html += `<hr class="divider">`;

            // 盘口信息
            html += `<div style="display:flex;flex-wrap:wrap;gap:18px 30px;font-size:15px;">`;
            html += `<div><span class="chip">盘口</span> <strong>${handicap.toFixed(2)}</strong></div>`;
            html += `<div><span class="chip">大球赔率</span> <strong>${overOdds.toFixed(2)}</strong></div>`;
            html += `<div><span class="chip">小球赔率</span> <strong>${underOdds.toFixed(2)}</strong></div>`;
            html += `</div>`;

            html += `<div class="mt-8" style="background:#f2f5f9;padding:10px 16px;border-radius:8px;font-size:14px;">`;
            html += `<span class="tag">${info.type}</span> ${info.description}`;

            if (info.lo !== null && info.hi !== null) {
                html += `<br><span style="color:#4a5a6e;font-size:13px;">拆解底层：${info.lo.toFixed(1)} 盘 + ${info.hi.toFixed(1)} 盘（各 50%）</span>`;
            }
            html += `</div>`;

            // 对于复合盘口，展示拆解后的等效区间
            const frac = Math.round((handicap - Math.floor(handicap)) * 100) / 100;
            if (Math.abs(frac - 0.25) < 0.01 || Math.abs(frac - 0.75) < 0.01) {
                html += `<div class="mt-8" style="background:#f0f4fb;padding:10px 16px;border-radius:8px;font-size:14px;border:1px dashed #b8c8da;">`;
                html += `<span style="font-weight:600;">🔍 等效结算规则</span><br>`;
                if (Math.abs(frac - 0.25) < 0.01) {
                    html +=
                        `• 大球：0~${Math.floor(handicap)-1}球全输，${Math.floor(handicap)}球输一半，≥${Math.floor(handicap)+1}球全赢<br>`;
                    html +=
                        `• 小球：0~${Math.floor(handicap)-1}球全赢，${Math.floor(handicap)}球赢一半，≥${Math.floor(handicap)+1}球全输`;
                } else {
                    html +=
                        `• 大球：0~${Math.floor(handicap)}球全输，${Math.floor(handicap)+1}球赢一半，≥${Math.floor(handicap)+2}球全赢<br>`;
                    html +=
                        `• 小球：0~${Math.floor(handicap)}球全赢，${Math.floor(handicap)+1}球输一半，≥${Math.floor(handicap)+2}球全输`;
                }
                html += `</div>`;
            }

            document.getElementById('step1Content').innerHTML = html;
        }

        function renderStep2(result) {
            const { detailOver, detailUnder, evOver, evUnder, overOdds, underOdds, overNet, underNet, handicap } = result;

            let html = `<div class="grid-2">`;

            // 大球
            html += `<div><div style="font-weight:600;color:#1a3a5e;margin-bottom:6px;">🔴 大球 (Over ${handicap.toFixed(2)}) 赔率 ${overOdds.toFixed(2)}</div>`;
            html += `<table><thead><tr><th>赛果</th><th>概率</th><th>盈亏</th><th>贡献</th></tr></thead><tbody>`;
            let overTotal = 0;
            for (const d of detailOver) {
                let factorStr = '';
                if (d.factor === 1) factorStr = `+${overNet.toFixed(2)}`;
                else if (d.factor === -1) factorStr = '-1.00';
                else if (d.factor === -0.5) factorStr = '-0.50';
                else if (d.factor === 0.5) factorStr = `+${(overNet/2).toFixed(2)}`;
                else factorStr = '0.00';
                const contrib = d.prob * (d.factor === 1 ? overNet : d.factor === -1 ? -1 : d.factor === -0.5 ? -0.5 : d
                    .factor === 0.5 ? overNet / 2 : 0);
                overTotal += contrib;
                const color = contrib > 0.001 ? '#1a7a4a' : contrib < -0.001 ? '#b33636' : '#6a7a8e';
                html += `<tr><td>${d.label}</td><td>${fmtP(d.prob)}</td><td>${factorStr}</td>
                          <td style="color:${color};font-weight:500;">${contrib >= 0 ? '+' : ''}${contrib.toFixed(4)}</td></tr>`;
            }
            html +=
                `<tr style="border-top:2px solid #1a3a5e;font-weight:700;"><td colspan="3">期望价值 (EV)</td><td style="color:${evOver >= 0 ? '#1a7a4a' : '#b33636'};">${evOver >= 0 ? '+' : ''}${(evOver*100).toFixed(2)}%</td></tr>`;
            html += `</tbody></table></div>`;

            // 小球
            html += `<div><div style="font-weight:600;color:#1a3a5e;margin-bottom:6px;">🔵 小球 (Under ${handicap.toFixed(2)}) 赔率 ${underOdds.toFixed(2)}</div>`;
            html += `<table><thead><tr><th>赛果</th><th>概率</th><th>盈亏</th><th>贡献</th></tr></thead><tbody>`;
            let underTotal = 0;
            for (const d of detailUnder) {
                let factorStr = '';
                if (d.factor === 1) factorStr = `+${underNet.toFixed(2)}`;
                else if (d.factor === -1) factorStr = '-1.00';
                else if (d.factor === -0.5) factorStr = '-0.50';
                else if (d.factor === 0.5) factorStr = `+${(underNet/2).toFixed(2)}`;
                else factorStr = '0.00';
                const contrib = d.prob * (d.factor === 1 ? underNet : d.factor === -1 ? -1 : d.factor === -0.5 ? -0.5 : d
                    .factor === 0.5 ? underNet / 2 : 0);
                underTotal += contrib;
                const color = contrib > 0.001 ? '#1a7a4a' : contrib < -0.001 ? '#b33636' : '#6a7a8e';
                html += `<tr><td>${d.label}</td><td>${fmtP(d.prob)}</td><td>${factorStr}</td>
                          <td style="color:${color};font-weight:500;">${contrib >= 0 ? '+' : ''}${contrib.toFixed(4)}</td></tr>`;
            }
            html +=
                `<tr style="border-top:2px solid #1a3a5e;font-weight:700;"><td colspan="3">期望价值 (EV)</td><td style="color:${evUnder >= 0 ? '#1a7a4a' : '#b33636'};">${evUnder >= 0 ? '+' : ''}${(evUnder*100).toFixed(2)}%</td></tr>`;
            html += `</tbody></table></div>`;

            html += `</div>`;

            // 总结
            html += `<div class="result-box ${evOver < 0 && evUnder < 0 ? 'danger' : evOver > 0 || evUnder > 0 ? 'success' : 'warning'}" style="margin-top:12px;">`;
            html += `<strong>📌 EV 解读</strong><br>`;
            html += `大球 EV = <strong style="color:${evOver >= 0 ? '#1a7a4a' : '#b33636'};">${(evOver*100).toFixed(2)}%</strong> &nbsp;|&nbsp; 小球 EV = <strong style="color:${evUnder >= 0 ? '#1a7a4a' : '#b33636'};">${(evUnder*100).toFixed(2)}%</strong><br>`;
            if (evOver < 0 && evUnder < 0) {
                html += `⚠️ 两边均为负期望，庄家优势明显。长期投注将导致亏损。`;
            } else if (evOver > 0 && evUnder > 0) {
                html += `✅ 两边均为正期望，存在套利机会！（罕见）`;
            } else if (evOver > 0) {
                html += `✅ 大球具有正期望值，值得关注。`;
            } else if (evUnder > 0) {
                html += `✅ 小球具有正期望值，值得关注。`;
            } else {
                html += `⚖️ 两边期望接近零，近乎公平博弈。`;
            }
            html += `</div>`;

            document.getElementById('step2Content').innerHTML = html;
        }

        function renderStep3(result) {
            const { fairOver, fairUnder, overEffProb, underEffProb, evOver, evUnder, overWinFull, overWinHalfP, overLoseFull,
                overLoseHalfP, underWinFull, underWinHalfP, underLoseFull, underLoseHalfP, handicap } = result;

            let html = `<div class="grid-2">`;

            // 大球
            html += `<div><div style="font-weight:600;color:#1a3a5e;margin-bottom:6px;">🔴 大球 (Over ${handicap.toFixed(2)})</div>`;
            html += `<table><thead><tr><th>项目</th><th>概率</th></tr></thead><tbody>`;
            html += `<tr><td>全赢</td><td>${fmtP(overWinFull)}</td></tr>`;
            if (overWinHalfP > 0.0001) html += `<tr><td>赢一半</td><td>${fmtP(overWinHalfP)}</td></tr>`;
            if (overLoseHalfP > 0.0001) html += `<tr><td>输一半</td><td>${fmtP(overLoseHalfP)}</td></tr>`;
            html += `<tr><td>全输</td><td>${fmtP(overLoseFull)}</td></tr>`;
            html +=
                `<tr style="border-top:2px solid #dce2ea;font-weight:600;"><td>等效真实胜率</td><td style="color:${overEffProb > fairOver ? '#1a7a4a' : '#b33636'};">${fmtP(overEffProb)}</td></tr>`;
            html +=
                `<tr><td>公平概率 (赔率隐含)</td><td style="color:#2b6c9e;">${fmtP(fairOver)}</td></tr>`;
            const diffOver = overEffProb - fairOver;
            html +=
                `<tr style="border-top:2px solid #1a3a5e;font-weight:700;"><td>差值</td><td style="color:${diffOver > 0.005 ? '#1a7a4a' : diffOver < -0.005 ? '#b33636' : '#9e6d1b'};">${diffOver >= 0 ? '+' : ''}${(diffOver*100).toFixed(2)}%</td></tr>`;
            html += `</tbody></table>`;
            if (diffOver > 0.005) {
                html += `<div class="result-box success" style="margin-top:8px;font-size:14px;">✅ 真实胜率高于公平概率，具有正价值</div>`;
            } else if (diffOver < -0.005) {
                html += `<div class="result-box danger" style="margin-top:8px;font-size:14px;">❌ 真实胜率低于公平概率，价值为负</div>`;
            } else {
                html += `<div class="result-box warning" style="margin-top:8px;font-size:14px;">⚖️ 真实胜率与公平概率接近，价值中性</div>`;
            }
            html += `</div>`;

            // 小球
            html += `<div><div style="font-weight:600;color:#1a3a5e;margin-bottom:6px;">🔵 小球 (Under ${handicap.toFixed(2)})</div>`;
            html += `<table><thead><tr><th>项目</th><th>概率</th></tr></thead><tbody>`;
            html += `<tr><td>全赢</td><td>${fmtP(underWinFull)}</td></tr>`;
            if (underWinHalfP > 0.0001) html += `<tr><td>赢一半</td><td>${fmtP(underWinHalfP)}</td></tr>`;
            if (underLoseHalfP > 0.0001) html += `<tr><td>输一半</td><td>${fmtP(underLoseHalfP)}</td></tr>`;
            html += `<tr><td>全输</td><td>${fmtP(underLoseFull)}</td></tr>`;
            html +=
                `<tr style="border-top:2px solid #dce2ea;font-weight:600;"><td>等效真实胜率</td><td style="color:${underEffProb > fairUnder ? '#1a7a4a' : '#b33636'};">${fmtP(underEffProb)}</td></tr>`;
            html +=
                `<tr><td>公平概率 (赔率隐含)</td><td style="color:#2b6c9e;">${fmtP(fairUnder)}</td></tr>`;
            const diffUnder = underEffProb - fairUnder;
            html +=
                `<tr style="border-top:2px solid #1a3a5e;font-weight:700;"><td>差值</td><td style="color:${diffUnder > 0.005 ? '#1a7a4a' : diffUnder < -0.005 ? '#b33636' : '#9e6d1b'};">${diffUnder >= 0 ? '+' : ''}${(diffUnder*100).toFixed(2)}%</td></tr>`;
            html += `</tbody></table>`;
            if (diffUnder > 0.005) {
                html += `<div class="result-box success" style="margin-top:8px;font-size:14px;">✅ 真实胜率高于公平概率，具有正价值</div>`;
            } else if (diffUnder < -0.005) {
                html += `<div class="result-box danger" style="margin-top:8px;font-size:14px;">❌ 真实胜率低于公平概率，价值为负</div>`;
            } else {
                html += `<div class="result-box warning" style="margin-top:8px;font-size:14px;">⚖️ 真实胜率与公平概率接近，价值中性</div>`;
            }
            html += `</div>`;

            html += `</div>`;

            html += `<div class="footnote">* 等效真实胜率 = (全赢概率 + 0.5×赢半概率) / (全赢 + 0.5×赢半 + 全输 + 0.5×输半)，剔除走水/半输影响后与公平概率对比。</div>`;

            document.getElementById('step3Content').innerHTML = html;
        }

        function renderStep4(result) {
            const { evOver, evUnder, overOdds, underOdds, handicap, overEffProb, underEffProb, fairOver, fairUnder } = result;

            let html = '';

            // 对比表格
            html += `<div style="overflow-x:auto;">`;
            html += `<table><thead><tr><th style="min-width:140px;">指标</th><th style="text-align:center;">🔴 大球</th><th style="text-align:center;">🔵 小球</th><th style="text-align:center;min-width:80px;">优势方</th></tr></thead><tbody>`;

            const rows = [{
                label: '赔率',
                over: overOdds.toFixed(2),
                under: underOdds.toFixed(2),
                winner: overOdds > underOdds ? '大球' : overOdds < underOdds ? '小球' : '平'
            }, {
                label: '等效真实胜率',
                over: fmtP(overEffProb),
                under: fmtP(underEffProb),
                winner: overEffProb > underEffProb ? '大球' : overEffProb < underEffProb ? '小球' : '平'
            }, {
                label: '公平概率 (隐含)',
                over: fmtP(fairOver),
                under: fmtP(fairUnder),
                winner: '—'
            }, {
                label: '期望价值 (EV)',
                over: (evOver * 100).toFixed(2) + '%',
                under: (evUnder * 100).toFixed(2) + '%',
                winner: evOver > evUnder ? '大球' : evOver < evUnder ? '小球' : '平'
            }, ];

            for (const r of rows) {
                const overColor = r.label === '期望价值 (EV)' ? (evOver >= 0 ? '#1a7a4a' : '#b33636') : '';
                const underColor = r.label === '期望价值 (EV)' ? (evUnder >= 0 ? '#1a7a4a' : '#b33636') : '';
                html += `<tr>
                            <td><strong>${r.label}</strong></td>
                            <td style="text-align:center;font-weight:500;color:${overColor};">${r.over}</td>
                            <td style="text-align:center;font-weight:500;color:${underColor};">${r.under}</td>
                            <td style="text-align:center;font-weight:600;font-size:14px;">
                                ${r.winner === '大球' ? '🔴' : r.winner === '小球' ? '🔵' : '⚖️'}
                                ${r.winner !== '—' ? r.winner : ''}
                            </td>
                        </tr>`;
            }

            // 加一行 "全赢概率"
            html += `<tr><td><strong>全赢概率</strong></td>
                        <td style="text-align:center;">${fmtP(result.overWinFull)}</td>
                        <td style="text-align:center;">${fmtP(result.underWinFull)}</td>
                        <td style="text-align:center;">${result.overWinFull > result.underWinFull ? '🔴 大球' : result.overWinFull < result.underWinFull ? '🔵 小球' : '⚖️ 平'}</td>
                     </tr>`;
            // 全输概率
            html += `<tr><td><strong>全输概率</strong></td>
                        <td style="text-align:center;">${fmtP(result.overLoseFull)}</td>
                        <td style="text-align:center;">${fmtP(result.underLoseFull)}</td>
                        <td style="text-align:center;">${result.overLoseFull < result.underLoseFull ? '🔴 大球 (更低)' : result.overLoseFull > result.underLoseFull ? '🔵 小球 (更低)' : '⚖️ 平'}</td>
                     </tr>`;

            html += `</tbody></table>`;
            html += `</div>`;

            // 结论
            html += `<div class="conclusion-box">`;
            html += `<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;">`;
            html += `<div><span style="font-size:18px;font-weight:700;">🏆 单次下注建议</span></div>`;

            // 决策逻辑
            let recommendation = '';
            let recColor = '';
            let recDetail = '';

            const betterEV = evOver > evUnder ? 'over' : (evUnder > evOver ? 'under' : 'tie');

            if (betterEV === 'over' && evOver > 0) {
                recommendation = '下注 大球 (Over)';
                recColor = '#1a7a4a';
                recDetail = '大球具有正期望值，是价值投注的绝佳机会。';
            } else if (betterEV === 'under' && evUnder > 0) {
                recommendation = '下注 小球 (Under)';
                recColor = '#1a7a4a';
                recDetail = '小球具有正期望值，是价值投注的绝佳机会。';
            } else if (betterEV === 'over' && evOver < 0 && evUnder < 0) {
                recommendation = '建议不下注 (如必须下，选大球)';
                recColor = '#b45f1b';
                recDetail = `虽然两边均为负EV，但大球 (${(evOver*100).toFixed(2)}%) 比小球 (${(evUnder*100).toFixed(2)}%) 亏损更少，相对更优。`;
            } else if (betterEV === 'under' && evOver < 0 && evUnder < 0) {
                recommendation = '建议不下注 (如必须下，选小球)';
                recColor = '#b45f1b';
                recDetail = `虽然两边均为负EV，但小球 (${(evUnder*100).toFixed(2)}%) 比大球 (${(evOver*100).toFixed(2)}%) 亏损更少，相对更优。`;
            } else if (betterEV === 'over') {
                recommendation = '下注 大球 (Over)';
                recColor = '#1a7a4a';
                recDetail = `大球 EV 为 ${(evOver*100).toFixed(2)}%，高于小球的 ${(evUnder*100).toFixed(2)}%，是更优选择。`;
            } else if (betterEV === 'under') {
                recommendation = '下注 小球 (Under)';
                recColor = '#1a7a4a';
                recDetail = `小球 EV 为 ${(evUnder*100).toFixed(2)}%，高于大球的 ${(evOver*100).toFixed(2)}%，是更优选择。`;
            } else {
                recommendation = '两边 EV 相等，无差异';
                recColor = '#6a7a8e';
                recDetail = '大球和小球的期望价值相同，无法从数学角度区分优劣。';
            }

            // 如果两边都是负的，强调"不下注"是最优
            if (evOver < 0 && evUnder < 0) {
                html += `<div style="font-size:20px;font-weight:700;color:${recColor};">${recommendation}</div>`;
                html += `</div>`;
                html +=
                `<div style="margin-top:10px;padding:10px 16px;background:#fcf3e0;border-radius:8px;border-left:4px solid #b45f1b;font-size:15px;">`;
                html += `⚠️ <strong>最优决策：不下注</strong> — 两边均为负期望，长期必亏。若必须下注，选择 ${evOver > evUnder ? '大球' : '小球'} (亏损更小)。<br>`;
                html += `<span style="font-size:13px;color:#5a6a7e;">${recDetail}</span>`;
                html += `</div>`;
            } else if (evOver > 0 && evUnder > 0) {
                html += `<div style="font-size:20px;font-weight:700;color:${recColor};">${recommendation}</div>`;
                html += `</div>`;
                html +=
                `<div style="margin-top:10px;padding:10px 16px;background:#e4f5ec;border-radius:8px;border-left:4px solid #1f7b4d;font-size:15px;">`;
                html += `✅ <strong>正期望机会！</strong> ${recDetail}<br>`;
                html += `<span style="font-size:13px;color:#1a6e42;">选择 EV 更高的方向，长期可获得正收益。</span>`;
                html += `</div>`;
            } else {
                html += `<div style="font-size:20px;font-weight:700;color:${recColor};">${recommendation}</div>`;
                html += `</div>`;
                html +=
                `<div style="margin-top:10px;padding:10px 16px;background:#e3eef9;border-radius:8px;border-left:4px solid #2b6c9e;font-size:15px;">`;
                html += `📊 ${recDetail}<br>`;
                html += `<span style="font-size:13px;color:#4a5a6e;">选择 EV 更高的方向，最大化单次下注的数学期望。</span>`;
                html += `</div>`;
            }

            html += `</div>`;

            // 附加：风险提示
            html += `<div style="margin-top:10px;font-size:13px;color:#5a6a7e;background:#f2f5f9;padding:8px 16px;border-radius:8px;">`;
            html += `💡 单次下注存在波动风险，EV 为正不代表单次必胜。建议结合自身资金管理和风险偏好决策。`;
            html += `</div>`;

            document.getElementById('step4Content').innerHTML = html;
        }

        // ============================================================
        //  主控函数
        // ============================================================

        function analyze() {
            const textarea = document.getElementById('inputData');
            const text = textarea.value;

            try {
                const { probs, overOdds, underOdds, handicap } = parseData(text);

                // 计算
                const result = computeEV(probs, overOdds, underOdds, handicap);

                // 渲染
                renderStep1(result);
                renderStep2(result);
                renderStep3(result);
                renderStep4(result);

                document.getElementById('resultArea').classList.add('visible');

                // 滚动到结果
                document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth', block: 'start' });

            } catch (err) {
                alert('❌ 解析错误：' + err.message + '\n\n请检查数据格式是否正确。\n格式：8个概率值 + 大球赔率 + 盘口 + 小球赔率\n示例：0.094 0.222 0.263 0.207 0.122 0.058 0.023 0.011 1.86 2.25 1.94');
                console.error(err);
            }
        }

        function loadExample() {
            const example =
                `0	1	2	3	4	5	6	7	大	盘口	小\n0.094	0.222	0.263	0.207	0.122	0.058	0.023	0.011	1.86	2.25	1.94`;
            document.getElementById('inputData').value = example;
            // 自动分析
            analyze();
        }

        function clearAll() {
            document.getElementById('inputData').value = '';
            document.getElementById('resultArea').classList.remove('visible');
            document.getElementById('step1Content').innerHTML = '';
            document.getElementById('step2Content').innerHTML = '';
            document.getElementById('step3Content').innerHTML = '';
            document.getElementById('step4Content').innerHTML = '';
        }

        // 支持 Ctrl+Enter 快捷键
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                const active = document.activeElement;
                if (active && active.id === 'inputData') {
                    e.preventDefault();
                    analyze();
                }
            }
        });

        // 页面加载后自动聚焦
        window.onload = function() {
            document.getElementById('inputData').focus();
        };
    </script>
</body>
</html>
