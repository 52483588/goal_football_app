<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>让球盘 EV 分析工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;

        body {

        }
        .btn {

        .btn-secondary:hover {

        .btn-outline:hover {

        }
        .btn-danger-outline {

        .badge {

                background: #fff;

                box-shadow: none;

</head>
<body>
    <div class="container">
        <div class="flex-between" style="margin-bottom:6px;">
            <h1>⚽ 让球盘 EV 分析工具</h1>
            <span style="font-size:14px;color:#4a5a6e;">v1.0 · 亚洲盘口精算</span>
        </div>
        <div class="subtitle">
            粘贴数据 → 自动解析 → 四步分析 → 投注建议<br>
            <span style="font-size:13px;color:#5a6a7e;">支持 整数盘 · 半球盘 · 四分之一盘 · 四分之三盘</span>
        </div>

        <!-- ===== 输入区 ===== -->
        <div class="card">
            <div class="card-title">
                📋 数据输入
                <span style="font-size:13px;font-weight:400;color:#5a6a7e;margin-left:6px;">粘贴下方数据（制表符/空格分隔）</span>
            </div>
            <textarea id="inputData" placeholder="粘贴数据…&#10;示例：&#10;1.0%&#10;1.9%	2.9%&#10;3.9%	8.3%&#10;9.1%	17.7%&#10;16.3%	25.5%&#10;21.6%	22.5%&#10;20.4%	13.4%&#10;14.2%	5.9%&#10;7.6%	2.8%&#10;5.0%	λ总 2.691&#10;λ 1.589/1.985&#10;1.20e-12	2&#10;公平P:47.1%&#10;EV -0.05&#10;+0.00%&#10;1.78&#10;公平P:52.9%&#10;EV -0.05&#10;-0.00%&#10;0.25"></textarea>
            <div class="input-actions">
                <button class="btn btn-primary" onclick="analyze()">🚀 计算分析</button>
                <button class="btn btn-secondary" onclick="loadExample()">📌 加载示例</button>
                <button class="btn btn-danger-outline" onclick="clearAll()">✕ 清空</button>
                <span class="example-hint" onclick="loadExample()">点击加载示例数据</span>
            </div>
        </div>

        <!-- ===== 结果区 ===== -->
        <div id="resultArea">
            <!-- 第一步 -->
            <div class="card fade-in" id="step1">
                <div class="card-title"><span class="step-badge">第一步</span> 数据与盘口拆解</div>
                <div id="step1Content"></div>
            </div>

            <!-- 第二步 -->
            <div class="card fade-in" id="step2">
                <div class="card-title"><span class="step-badge green">第二步</span> 精确计算期望价值 (EV)</div>
                <div id="step2Content"></div>
            </div>

            <!-- 第三步 -->
            <div class="card fade-in" id="step3">
                <div class="card-title"><span class="step-badge orange">第三步</span> 价值投注视角 <span style="font-size:13px;font-weight:400;color:#5a6a7e;">剔除走水 / 半输影响</span></div>
                <div id="step3Content"></div>
            </div>

            <!-- 第四步 -->
            <div class="card fade-in" id="step4">
                <div class="card-title"><span class="step-badge purple">第四步</span> 结论 · 单次下注建议</div>
                <div id="step4Content"></div>
            </div>
        </div>

        <div style="text-align:center;color:#7a8a9e;font-size:13px;padding:20px 0 6px;border-top:1px solid #e2e8f0;margin-top:8px;">
            数据仅用于分析参考 · 投注有风险，请理性决策
        </div>
    </div>

    <script>
        // ============================================================
        //  核心工具函数
        // ============================================================

        function parseData(text) {
            // 提取所有数字（包括科学计数法）
            const numRegex = /[-+]?\d*\.?\d+(?:[eE][-+]?\d+)?/g;
            const numbers = [];
            let match;
            while ((match = numRegex.exec(text)) !== null) {
                numbers.push(parseFloat(match[0]));
            }
            if (numbers.length < 31) {
                throw new Error('提取的数字不足31个，请确认数据格式是否正确。');
            }
            // 净胜球概率索引：0,2,4,6,8,10,12,14,16
            const probIndices = [0, 2, 4, 6, 8, 10, 12, 14, 16];
            const probs = probIndices.map(i => numbers[i] / 100); // 百分比转小数
            // 主队赔率 index 22, 客队赔率 index 26, 盘口 index 30
            const homeOdds = numbers[22];
            const awayOdds = numbers[26];
            const handicap = numbers[30];

            // 概率和校验
            const total = probs.reduce((a, b) => a + b, 0);
            if (Math.abs(total - 1) > 0.01) {
                console.warn('概率之和不为1，实际为:', total);
            }
            return { probs, homeOdds, awayOdds, handicap };
        }

        // ---------- 累积概率（辅助） ----------
        function cumProb(probs, from, to) {
            // 这里用不到，但保留
        }

        // ---------- 盘口拆解信息 ----------
        function getHandicapInfo(handicap) {
            const absH = Math.abs(handicap);
            const intPart = Math.floor(absH);
            const frac = Math.round((absH - intPart) * 100) / 100;
            let type = '';
            let description = '';
            let lo = null,
                hi = null;

            // 确定方向
            const direction = handicap > 0 ? '客队让主队' : (handicap < 0 ? '主队让客队' : '平手盘');
            const dirSymbol = handicap > 0 ? '客队让' : (handicap < 0 ? '主队让' : '');

            if (Math.abs(frac - 0.5) < 0.01) {
                type = '半球盘';
                description = `盘口 ${handicap.toFixed(2)} 属于半球盘，无走水，直接分出胜负。${direction}`;
            } else if (Math.abs(frac) < 0.01) {
                type = '整数盘';
                description = `盘口 ${handicap.toFixed(2)} 属于整数盘，当净胜球+盘口 = 0 时走水（本金退还）。${direction}`;
            } else if (Math.abs(frac - 0.25) < 0.01) {
                type = '四分之一盘';
                lo = intPart;
                hi = intPart + 0.5;
                description =
                `盘口 ${handicap.toFixed(2)} 属于四分之一盘，拆解为：50% ${lo.toFixed(1)}盘 + 50% ${hi.toFixed(1)}盘。${direction}`;
            } else if (Math.abs(frac - 0.75) < 0.01) {
                type = '四分之三盘';
                lo = intPart + 0.5;
                hi = intPart + 1.0;
                description =
                `盘口 ${handicap.toFixed(2)} 属于四分之三盘，拆解为：50% ${lo.toFixed(1)}盘 + 50% ${hi.toFixed(1)}盘。${direction}`;
            } else {
                // 兜底
                if (frac < 0.25) { type = '整数盘(近似)';
                    description = `盘口 ${handicap.toFixed(2)} 近似为整数盘处理。${direction}`; } else if (frac < 0.5) { type =
                        '四分之一盘(近似)';
                    description = `盘口 ${handicap.toFixed(2)} 近似为四分之一盘处理。${direction}`;
                    lo = intPart;
                    hi = intPart + 0.5; } else if (frac < 0.75) { type = '半球盘(近似)';
                    description = `盘口 ${handicap.toFixed(2)} 近似为半球盘处理。${direction}`; } else { type = '四分之三盘(近似)';
                    description = `盘口 ${handicap.toFixed(2)} 近似为四分之三盘处理。${direction}`;
                    lo = intPart + 0.5;
                    hi = intPart + 1.0; }
            }

            return { type, description, lo, hi, intPart, frac, direction };
        }

        // ---------- 计算 EV ----------
        function computeEV(probs, homeOdds, awayOdds, handicap) {
            // 净胜球值：+4, +3, +2, +1, 0, -1, -2, -3, -4
            const goalValues = [4, 3, 2, 1, 0, -1, -2, -3, -4];
            let homeFullWin = 0,
                homeHalfWin = 0,
                homePush = 0,
                homeHalfLoss = 0,
                homeFullLoss = 0;

            for (let i = 0; i < probs.length; i++) {
                const p = probs[i];
                const g = goalValues[i];
                const adj = g + handicap;
                const rounded = Math.round(adj * 100) / 100; // 避免浮点误差
                if (rounded >= 0.5) {
                    homeFullWin += p;
                } else if (rounded === 0.25) {
                    homeHalfWin += p;
                } else if (rounded === 0) {
                    homePush += p;
                } else if (rounded === -0.25) {
                    homeHalfLoss += p;
                } else if (rounded <= -0.5) {
                    homeFullLoss += p;
                } else {
                    // 意外情况，忽略（实际上不会发生）
                }
            }

            // 客队对应
            const awayFullWin = homeFullLoss;
            const awayHalfWin = homeHalfLoss;
            const awayPush = homePush;
            const awayHalfLoss = homeHalfWin;
            const awayFullLoss = homeFullWin;

            // EV 计算
            const homeNet = homeOdds - 1;
            const awayNet = awayOdds - 1;
            const evHome = homeFullWin * homeNet + homeHalfWin * (homeNet / 2) + homeHalfLoss * (-0.5) + homeFullLoss * (-1);
            const evAway = awayFullWin * awayNet + awayHalfWin * (awayNet / 2) + awayHalfLoss * (-0.5) + awayFullLoss * (-1);

            // 公平概率
            const invHome = 1 / homeOdds;
            const invAway = 1 / awayOdds;
            const fairHome = invHome / (invHome + invAway);
            const fairAway = invAway / (invHome + invAway);

            // 等效真实胜率（剔除走水）
            const homeEffWin = homeFullWin + 0.5 * homeHalfWin;
            const homeEffLoss = homeFullLoss + 0.5 * homeHalfLoss;
            const homeEffProb = (homeEffWin + homeEffLoss) > 0 ? homeEffWin / (homeEffWin + homeEffLoss) : 0;
            const awayEffWin = awayFullWin + 0.5 * awayHalfWin;
            const awayEffLoss = awayFullLoss + 0.5 * awayHalfLoss;
            const awayEffProb = (awayEffWin + awayEffLoss) > 0 ? awayEffWin / (awayEffWin + awayEffLoss) : 0;

            // 盘口信息
            const handicapInfo = getHandicapInfo(handicap);

            // 用于渲染的详细数据（每个净胜球区间的调整值及盈亏）
            const details = [];
            for (let i = 0; i < probs.length; i++) {
                const g = goalValues[i];
                const adj = g + handicap;
                const rounded = Math.round(adj * 100) / 100;
                let homeFactor = 0,
                    awayFactor = 0;
                // 主队盈亏因子（相对于下注1单位）
                if (rounded >= 0.5) homeFactor = homeNet;
                else if (rounded === 0.25) homeFactor = homeNet / 2;
                else if (rounded === 0) homeFactor = 0;
                else if (rounded === -0.25) homeFactor = -0.5;
                else if (rounded <= -0.5) homeFactor = -1;
                // 客队盈亏因子
                if (rounded >= 0.5) awayFactor = -1;
                else if (rounded === 0.25) awayFactor = -0.5;
                else if (rounded === 0) awayFactor = 0;
                else if (rounded === -0.25) awayFactor = awayNet / 2;
                else if (rounded <= -0.5) awayFactor = awayNet;

                details.push({
                    label: g >= 4 ? '+4+' : (g <= -4 ? '-4-' : (g > 0 ? '+' + g : g.toString())),
                    prob: probs[i],
                    adj: rounded,
                    homeFactor: homeFactor,
                    awayFactor: awayFactor,
                    homeContrib: probs[i] * homeFactor,
                    awayContrib: probs[i] * awayFactor
                });
            }

            return {
                probs,
                goalValues,
                homeOdds,
                awayOdds,
                handicap,
                handicapInfo,
                homeFullWin,
                homeHalfWin,
                homePush,
                homeHalfLoss,
                homeFullLoss,
                awayFullWin,
                awayHalfWin,
                awayPush,
                awayHalfLoss,
                awayFullLoss,
                evHome,
                evAway,
                fairHome,
                fairAway,
                homeEffProb,
                awayEffProb,
                homeNet,
                awayNet,
                details
            };
        }

        // ============================================================
        //  渲染函数
        // ============================================================

        function fmtP(v) {
            return (v * 100).toFixed(2) + '%';
        }

        function fmtNum(v, d = 4) {
            return Number(v).toFixed(d);
        }

        function fmtOdds(v) {
            return v.toFixed(2);
        }

        function renderStep1(data) {
            const { probs, homeOdds, awayOdds, handicap, handicapInfo, details } = data;
            let html = '';

            // 概率分布
            html += `<div class="flex-between mb-8"><span style="font-weight:600;">📊 净胜球概率分布</span>
                      <span class="chip">总和 ${(probs.reduce((a,b)=>a+b,0)*100).toFixed(2)}%</span></div>`;
            html += `<div style="display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:12px;">`;
            const labels = ['+4+', '+3', '+2', '+1', '0', '-1', '-2', '-3', '-4-'];
            for (let i = 0; i < probs.length; i++) {
                const pct = (probs[i] * 100).toFixed(2);
                html += `<span style="background:#eef2f6;padding:2px 12px;border-radius:20px;font-size:14px;">
                            <strong>${labels[i]}</strong> ${pct}%</span>`;
            }

            html += `<div style="display:flex;flex-wrap:wrap;gap:18px 30px;font-size:15px;">`;
            html += `<div><span class="chip">盘口</span> <strong>${handicap.toFixed(2)}</strong></div>`;
            html += `<div><span class="chip">主队赔率</span> <strong>${homeOdds.toFixed(2)}</strong></div>`;
            html += `<div><span class="chip">客队赔率</span> <strong>${awayOdds.toFixed(2)}</strong></div>`;
            html += `</div>`;

            html += `<div class="mt-8" style="background:#f2f5f9;padding:10px 16px;border-radius:8px;font-size:14px;">`;
            html += `<span class="tag">${handicapInfo.type}</span> ${handicapInfo.description}`;
            if (handicapInfo.lo !== null && handicapInfo.hi !== null) {
                html += `<br><span style="color:#4a5a6e;font-size:13px;">拆解底层：${handicapInfo.lo.toFixed(1)} 盘 + ${handicapInfo.hi.toFixed(1)} 盘（各 50%）</span>`;
            }

            html += `<span style="font-weight:600;">🔍 让球方向</span><br>`;
            html += `盘口 ${handicap > 0 ? '> 0' : (handicap < 0 ? '< 0' : '= 0')}，即 <strong>${handicapInfo.direction}</strong>。<br>`;
            html +=
                `主队净胜球 + 盘口 (${handicap > 0 ? '+' : ''}${handicap.toFixed(2)}) 后，≥0.5 全赢，0.25 赢半，0 走水，-0.25 输半，≤-0.5 全输。`;
            html += `</div>`;

            document.getElementById('step1Content').innerHTML = html;
        }

        function renderStep2(result) {
            const { details, evHome, evAway, homeOdds, awayOdds, handicap, homeNet, awayNet } = result;

            let html = `<div class="grid-2">`;

            // 主队
            html += `<div><div style="font-weight:600;color:#1a3a5e;margin-bottom:6px;">🏠 主队 赔率 ${homeOdds.toFixed(2)}</div>`;
            html += `<table><thead><tr><th>净胜球</th><th>概率</th><th>调整值</th><th>盈亏因子</th><th>贡献</th></tr></thead><tbody>`;
            let homeTotal = 0;
            for (const d of details) {
                const factorStr = d.homeFactor >= 0 ? '+' + d.homeFactor.toFixed(2) : d.homeFactor.toFixed(2);
                const color = d.homeContrib > 0.001 ? '#1a7a4a' : d.homeContrib < -0.001 ? '#b33636' : '#6a7a8e';

                            <td>${d.label}</td>

                `<tr style="border-top:2px solid #1a3a5e;font-weight:700;"><td colspan="4">期望价值 (EV)</td><td style="color:${evHome >= 0 ? '#1a7a4a' : '#b33636'};">${evHome >= 0 ? '+' : ''}${(evHome*100).toFixed(2)}%</td></tr>`;
            html += `</tbody></table></div>`;

            // 客队
            html += `<div><div style="font-weight:600;color:#1a3a5e;margin-bottom:6px;">✈️ 客队 赔率 ${awayOdds.toFixed(2)}</div>`;
            html += `<table><thead><tr><th>净胜球</th><th>概率</th><th>调整值</th><th>盈亏因子</th><th>贡献</th></tr></thead><tbody>`;

                            <td>${d.label}</td>

            html += `</tbody></table></div>`;

            html += `</div>`;

            html += `<div class="result-box ${evHome < 0 && evAway < 0 ? 'danger' : evHome > 0 || evAway > 0 ? 'success' : 'warning'}" style="margin-top:12px;">`;

            html +=
                `主队 EV = <strong style="color:${evHome >= 0 ? '#1a7a4a' : '#b33636'};">${(evHome*100).toFixed(2)}%</strong> &nbsp;|&nbsp; 客队 EV = <strong style="color:${evAway >= 0 ? '#1a7a4a' : '#b33636'};">${(evAway*100).toFixed(2)}%</strong><br>`;
            if (evHome < 0 && evAway < 0) {
                html += `⚠️ 两边均为负期望，庄家优势明显。长期投注将导致亏损。`;
            } else if (evHome > 0 && evAway > 0) {
                html += `✅ 两边均为正期望，存在套利机会！（罕见）`;
            } else if (evHome > 0) {
                html += `✅ 主队具有正期望值，值得关注。`;

        function renderStep3(result) {
            const { fairHome, fairAway, homeEffProb, awayEffProb, evHome, evAway,
                homeFullWin, homeHalfWin, homeFullLoss, homeHalfLoss,
                awayFullWin, awayHalfWin, awayFullLoss, awayHalfLoss,

            html += `<div><div style="font-weight:600;color:#1a3a5e;margin-bottom:6px;">🏠 主队</div>`;
            html += `<table><thead><tr><th>项目</th><th>概率</th></tr></thead><tbody>`;

                `<tr><td>公平概率 (隐含)</td><td style="color:#2b6c9e;">${fmtP(fairHome)}</td></tr>`;

            } else if (diffHome < -0.005) {
                html += `<div class="result-box danger" style="margin-top:8px;font-size:14px;">❌ 真实胜率低于公平概率，价值为负</div>`;
            } else {
                html += `<div class="result-box warning" style="margin-top:8px;font-size:14px;">⚖️ 真实胜率与公平概率接近，价值中性</div>`;
            }
            html += `</div>`;

            // 客队
            html += `<div><div style="font-weight:600;color:#1a3a5e;margin-bottom:6px;">✈️ 客队</div>`;

            if (awayHalfLoss > 0.0001) html += `<tr><td>输一半</td><td>${fmtP(awayHalfLoss)}</td></tr>`;
            html += `<tr><td>全输</td><td>${fmtP(awayFullLoss)}</td></tr>`;
            html +=
                `<tr style="border-top:2px solid #dce2ea;font-weight:600;"><td>等效真实胜率</td><td style="color:${awayEffProb > fairAway ? '#1a7a4a' : '#b33636'};">${fmtP(awayEffProb)}</td></tr>`;
            html +=
                `<tr><td>公平概率 (隐含)</td><td style="color:#2b6c9e;">${fmtP(fairAway)}</td></tr>`;
            const diffAway = awayEffProb - fairAway;
            html +=
                `<tr style="border-top:2px solid #1a3a5e;font-weight:700;"><td>差值</td><td style="color:${diffAway > 0.005 ? '#1a7a4a' : diffAway < -0.005 ? '#b33636' : '#9e6d1b'};">${diffAway >= 0 ? '+' : ''}${(diffAway*100).toFixed(2)}%</td></tr>`;
            html += `</tbody></table>`;
            if (diffAway > 0.005) {
                html += `<div class="result-box success" style="margin-top:8px;font-size:14px;">✅ 真实胜率高于公平概率，具有正价值</div>`;
            } else if (diffAway < -0.005) {
                html += `<div class="result-box danger" style="margin-top:8px;font-size:14px;">❌ 真实胜率低于公平概率，价值为负</div>`;

            html += `</div>`;

            html += `</div>`;

            document.getElementById('step3Content').innerHTML = html;
        }

        function renderStep4(result) {
            const { evHome, evAway, homeOdds, awayOdds, handicap, homeEffProb, awayEffProb, fairHome, fairAway } = result;

            let html = '';

            // 对比表格
            html += `<div style="overflow-x:auto;">`;
            html += `<table><thead><tr><th style="min-width:140px;">指标</th><th style="text-align:center;">🏠 主队</th><th style="text-align:center;">✈️ 客队</th><th style="text-align:center;min-width:80px;">优势方</th></tr></thead><tbody>`;

            const rows = [{
                label: '赔率',

                        <td style="text-align:center;">${fmtP(result.awayFullWin)}</td>

                     </tr>`;

            html += `<tr><td><strong>全输概率</strong></td>

                        <td style="text-align:center;">${fmtP(result.awayFullLoss)}</td>
                        <td style="text-align:center;">${result.homeFullLoss < result.awayFullLoss ? '🏠 主队 (更低)' : result.homeFullLoss > result.awayFullLoss ? '✈️ 客队 (更低)' : '⚖️ 平'}</td>
                     </tr>`;

            html += `</tbody></table>`;
            html += `</div>`;

            // 结论
            html += `<div class="conclusion-box">`;
            html += `<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;">`;
            html += `<div><span style="font-size:18px;font-weight:700;">🏆 单次下注建议</span></div>`;

            let recommendation = '';
            let recColor = '';
            let recDetail = '';

            const betterEV = evHome > evAway ? 'home' : (evAway > evHome ? 'away' : 'tie');

            if (betterEV === 'home' && evHome > 0) {
                recommendation = '下注 主队 (让球)';

                recDetail = '主队具有正期望值，是价值投注的绝佳机会。';
            } else if (betterEV === 'away' && evAway > 0) {
                recommendation = '下注 客队 (受让)';
                recColor = '#1a7a4a';
                recDetail = '客队具有正期望值，是价值投注的绝佳机会。';
            } else if (betterEV === 'home' && evHome < 0 && evAway < 0) {
                recommendation = '建议不下注 (如必须下，选主队)';
                recColor = '#b45f1b';
                recDetail = `虽然两边均为负EV，但主队 (${(evHome*100).toFixed(2)}%) 比客队 (${(evAway*100).toFixed(2)}%) 亏损更少，相对更优。`;
            } else if (betterEV === 'away' && evHome < 0 && evAway < 0) {
                recommendation = '建议不下注 (如必须下，选客队)';
                recColor = '#b45f1b';
                recDetail = `虽然两边均为负EV，但客队 (${(evAway*100).toFixed(2)}%) 比主队 (${(evHome*100).toFixed(2)}%) 亏损更少，相对更优。`;
            } else if (betterEV === 'home') {
                recommendation = '下注 主队 (让球)';
                recColor = '#1a7a4a';
                recDetail = `主队 EV 为 ${(evHome*100).toFixed(2)}%，高于客队的 ${(evAway*100).toFixed(2)}%，是更优选择。`;
            } else if (betterEV === 'away') {
                recommendation = '下注 客队 (受让)';
                recColor = '#1a7a4a';
                recDetail = `客队 EV 为 ${(evAway*100).toFixed(2)}%，高于主队的 ${(evHome*100).toFixed(2)}%，是更优选择。`;
            } else {
                recommendation = '两边 EV 相等，无差异';
                recColor = '#6a7a8e';
                recDetail = '主队和客队的期望价值相同，无法从数学角度区分优劣。';
            }

            if (evHome < 0 && evAway < 0) {
                html += `<div style="font-size:20px;font-weight:700;color:${recColor};">${recommendation}</div>`;
                html += `</div>`;
                html +=
                `<div style="margin-top:10px;padding:10px 16px;background:#fcf3e0;border-radius:8px;border-left:4px solid #b45f1b;font-size:15px;">`;
                html += `⚠️ <strong>最优决策：不下注</strong> — 两边均为负期望，长期必亏。若必须下注，选择 ${evHome > evAway ? '主队' : '客队'} (亏损更小)。<br>`;
                html += `<span style="font-size:13px;color:#5a6a7e;">${recDetail}</span>`;
                html += `</div>`;
            } else if (evHome > 0 && evAway > 0) {
                html += `<div style="font-size:20px;font-weight:700;color:${recColor};">${recommendation}</div>`;
                html += `</div>`;
                html +=
                `<div style="margin-top:10px;padding:10px 16px;background:#e4f5ec;border-radius:8px;border-left:4px solid #1f7b4d;font-size:15px;">`;
                html += `✅ <strong>正期望机会！</strong> ${recDetail}<br>`;
                html += `<span style="font-size:13px;color:#1a6e42;">选择 EV 更高的方向，长期可获得正收益。</span>`;
                html += `</div>`;
            } else {

                html += `</div>`;
                html +=
                `<div style="margin-top:10px;padding:10px 16px;background:#e3eef9;border-radius:8px;border-left:4px solid #2b6c9e;font-size:15px;">`;
                html += `📊 ${recDetail}<br>`;
                html += `<span style="font-size:13px;color:#4a5a6e;">选择 EV 更高的方向，最大化单次下注的数学期望。</span>`;
                html += `</div>`;
            }

            html += `</div>`;

            // 风险提示
            html += `<div style="margin-top:10px;font-size:13px;color:#5a6a7e;background:#f2f5f9;padding:8px 16px;border-radius:8px;">`;
            html += `💡 单次下注存在波动风险，EV 为正不代表单次必胜。建议结合自身资金管理和风险偏好决策。`;
            html += `</div>`;

            document.getElementById('step4Content').innerHTML = html;
        }

        function analyze() {
            const textarea = document.getElementById('inputData');
            const text = textarea.value;

            try {
                const { probs, homeOdds, awayOdds, handicap } = parseData(text);
                const result = computeEV(probs, homeOdds, awayOdds, handicap);

                renderStep1(result);
                renderStep2(result);
                renderStep3(result);
                renderStep4(result);

                document.getElementById('resultArea').classList.add('visible');
                document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth', block: 'start' });

            } catch (err) {
                alert('❌ 解析错误：' + err.message + '\n\n请检查数据格式是否正确。\n格式：净胜球概率（9个百分比，按顺序+4+..-4-） + 主队赔率 + 客队赔率 + 盘口。\n示例数据已内置，点击“加载示例”查看。');
                console.error(err);
            }
        }

            document.getElementById('step1Content').innerHTML = '';
            document.getElementById('step2Content').innerHTML = '';
            document.getElementById('step3Content').innerHTML = '';
            document.getElementById('step4Content').innerHTML = '';
        }

        // Ctrl+Enter 快捷键
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                const active = document.activeElement;
                if (active && active.id === 'inputData') {
                    e.preventDefault();
                    analyze();
                }
            }
        });

        window.onload = function() {
            document.getElementById('inputData').focus();
        };
    </script>
